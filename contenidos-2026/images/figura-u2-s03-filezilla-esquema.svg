<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Subir los archivos del caso pacientes con FileZilla</title>
  <desc id="desc">Esquema de FileZilla. En la ubicación local inicial aparecen pacientes.md y pacientes-metadatos.md. Una flecha indica su subida a la ubicación remota inicial, sin cambiar de carpeta.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12z" fill="#1f7a73"/>
    </marker>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#17365d}
      .subtitle{font:400 20px Arial,sans-serif;fill:#526270}
      .label{font:700 21px Arial,sans-serif;fill:#17365d}
      .copy{font:400 18px Arial,sans-serif;fill:#34495e}
      .small{font:400 15px Arial,sans-serif;fill:#526270}
      .file{font:700 20px 'Courier New',monospace;fill:#17365d}
      .white{font:700 16px Arial,sans-serif;fill:#fff}
      .status{font:700 18px Arial,sans-serif;fill:#256d49}
      .num{font:700 21px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" class="title" text-anchor="middle">Transferir los archivos con FileZilla</text>
  <text x="800" y="94" class="subtitle" text-anchor="middle">En S3 se conservan las ubicaciones iniciales: todavía no navegamos entre carpetas.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="132" width="1440" height="650" rx="18" fill="#f7f8f9" stroke="#9aa9b4" stroke-width="3"/>
  </g>
  <rect x="80" y="132" width="1440" height="55" rx="18" fill="#dfe5e9"/>
  <text x="800" y="168" class="label" text-anchor="middle">FileZilla · esquema sin credenciales reales</text>

  <rect x="105" y="207" width="1390" height="80" rx="12" fill="#fff" stroke="#c7d1d8" stroke-width="2"/>
  <circle cx="135" cy="227" r="22" fill="#5a73a8"/>
  <text x="135" y="228" class="num">1</text>
  <text x="170" y="233" class="label">Conéctate mediante SFTP</text>
  <text x="170" y="264" class="small">Servidor institucional · usuario · contraseña · puerto confirmado por el docente</text>
  <rect x="1250" y="225" width="205" height="42" rx="8" fill="#2878a9"/>
  <text x="1352" y="252" class="white" text-anchor="middle">CONEXIÓN RÁPIDA</text>

  <rect x="105" y="312" width="590" height="355" rx="12" fill="#fff" stroke="#8bb4cf" stroke-width="3"/>
  <rect x="905" y="312" width="590" height="355" rx="12" fill="#fff" stroke="#7ebdb8" stroke-width="3"/>
  <rect x="105" y="312" width="590" height="62" rx="12" fill="#eaf2f8"/>
  <rect x="905" y="312" width="590" height="62" rx="12" fill="#e4f3f1"/>

  <circle cx="135" cy="343" r="22" fill="#2878a9"/>
  <text x="135" y="344" class="num">2</text>
  <text x="170" y="350" class="label">Ubicación local inicial</text>
  <text x="170" y="402" class="small">Tu computadora</text>
  <rect x="135" y="424" width="530" height="72" rx="10" fill="#f4f8fb" stroke="#c5d9e7" stroke-width="2"/>
  <path d="M162 442h34l18 18v22h-52z" fill="#fff" stroke="#5a73a8" stroke-width="2"/>
  <path d="M196 442v18h18" fill="#eaf2f8" stroke="#5a73a8" stroke-width="2"/>
  <text x="232" y="467" class="file">pacientes.md</text>
  <rect x="135" y="514" width="530" height="72" rx="10" fill="#f4f8fb" stroke="#c5d9e7" stroke-width="2"/>
  <path d="M162 532h34l18 18v22h-52z" fill="#fff" stroke="#5a73a8" stroke-width="2"/>
  <path d="M196 532v18h18" fill="#eaf2f8" stroke="#5a73a8" stroke-width="2"/>
  <text x="232" y="557" class="file">pacientes-metadatos.md</text>

  <circle cx="935" cy="343" r="22" fill="#208b82"/>
  <text x="935" y="344" class="num">3</text>
  <text x="970" y="350" class="label">Ubicación remota inicial</text>
  <text x="970" y="402" class="small">Servidor del curso</text>
  <rect x="935" y="424" width="530" height="72" rx="10" fill="#f2faf8" stroke="#b7d9d4" stroke-width="2"/>
  <path d="M962 442h34l18 18v22h-52z" fill="#fff" stroke="#208b82" stroke-width="2"/>
  <path d="M996 442v18h18" fill="#e4f3f1" stroke="#208b82" stroke-width="2"/>
  <text x="1032" y="467" class="file">pacientes.md</text>
  <circle cx="1424" cy="460" r="18" fill="#3a9664"/>
  <path d="M1415 460l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="935" y="514" width="530" height="72" rx="10" fill="#f2faf8" stroke="#b7d9d4" stroke-width="2"/>
  <path d="M962 532h34l18 18v22h-52z" fill="#fff" stroke="#208b82" stroke-width="2"/>
  <path d="M996 532v18h18" fill="#e4f3f1" stroke="#208b82" stroke-width="2"/>
  <text x="1032" y="557" class="file">pacientes-metadatos.md</text>
  <circle cx="1424" cy="550" r="18" fill="#3a9664"/>
  <path d="M1415 550l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M725 474H875" fill="none" stroke="#1f7a73" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="800" y="444" class="label" text-anchor="middle">SUBIR</text>
  <text x="800" y="519" class="small" text-anchor="middle">Arrastra los dos archivos</text>
  <text x="800" y="544" class="small" text-anchor="middle">de izquierda a derecha</text>
  <rect x="700" y="573" width="200" height="54" rx="27" fill="#fff3cd" stroke="#d7ac35" stroke-width="2"/>
  <text x="800" y="596" class="small" text-anchor="middle">Sin cambiar</text>
  <text x="800" y="617" class="small" text-anchor="middle">de ubicación</text>

  <rect x="105" y="691" width="1390" height="65" rx="10" fill="#fff" stroke="#c7d1d8" stroke-width="2"/>
  <circle cx="135" cy="723" r="22" fill="#76629a"/>
  <text x="135" y="724" class="num">4</text>
  <text x="172" y="730" class="label">Estado:</text>
  <text x="270" y="730" class="status">2 transferencias correctas</text>
  <text x="565" y="730" class="copy">Después, comprueba ambos archivos en el servidor con</text>
  <text x="1065" y="730" class="file">ls -lh</text>

  <text x="800" y="830" class="subtitle" text-anchor="middle">La navegación por directorios y las rutas se estudiarán en la sesión S4.</text>
</svg>
