<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Procesos: primer plano, segundo plano y nohup</title><desc id="desc">Comparación entre procesos en primer plano, segundo plano y con nohup.</desc><defs><filter id="shadow" x="-12%" y="-12%" width="124%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#52738f"/></marker><marker id="arrowT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#1f6d7a"/></marker><style>.title{font:700 42px Arial;fill:#17365d}.subtitle{font:400 20px Arial;fill:#526270}.h1{font:700 27px Arial;fill:#17365d}.h2{font:700 22px Arial;fill:#17365d}.copy{font:400 18px Arial;fill:#34495e}.small{font:400 15px Arial;fill:#526270}.label{font:700 18px Arial;fill:#17365d}.code{font:700 25px 'Courier New';fill:#17365d}.codeS{font:700 17px 'Courier New';fill:#17365d}.white{font:700 20px Arial;fill:#fff}.whiteS{font:400 16px Arial;fill:#eaf6f7}.num{font:700 22px Arial;fill:#fff;text-anchor:middle;dominant-baseline:middle}.line{fill:none;stroke:#52738f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="58" class="title" text-anchor="middle">Procesos: primer plano, segundo plano y nohup</text><text x="800" y="95" class="subtitle" text-anchor="middle">La forma de iniciar un proceso determina si ocupa la terminal y qué ocurre cuando cierras la sesión.</text><g filter="url(#shadow)"><rect x="90" y="175" width="430" height="455" rx="20" fill="#f3f8fc" stroke="#8bb4cf" stroke-width="3"/></g><circle cx="305" cy="205" r="42" fill="#2878a9"/><path d="M285 205h40M305 185v40" stroke="#fff" stroke-width="6"/><text x="305" y="285" class="h1" text-anchor="middle">PRIMER PLANO</text><rect x="145" y="320" width="320" height="72" rx="12" fill="#18232c"/><text x="305" y="365" font-family="Courier New" font-size="21" fill="#fff" text-anchor="middle">comando</text><text x="305" y="455" class="copy" text-anchor="middle"><tspan x="305" dy="0">La terminal queda ocupada</tspan><tspan x="305" dy="34">Ctrl-C lo cancela</tspan><tspan x="305" dy="34">Debes esperar a que termine</tspan></text><g filter="url(#shadow)"><rect x="585" y="175" width="430" height="455" rx="20" fill="#f1faf9" stroke="#7ebdb8" stroke-width="3"/></g><circle cx="800" cy="205" r="42" fill="#208b82"/><path d="M780 205h40M800 185v40" stroke="#fff" stroke-width="6"/><text x="800" y="285" class="h1" text-anchor="middle">SEGUNDO PLANO</text><rect x="640" y="320" width="320" height="72" rx="12" fill="#18232c"/><text x="800" y="365" font-family="Courier New" font-size="21" fill="#fff" text-anchor="middle">comando &amp;</text><text x="800" y="455" class="copy" text-anchor="middle"><tspan x="800" dy="0">La terminal queda disponible</tspan><tspan x="800" dy="34">jobs muestra el trabajo</tspan><tspan x="800" dy="34">Puede terminar al cerrar sesión</tspan></text><g filter="url(#shadow)"><rect x="1080" y="175" width="430" height="455" rx="20" fill="#f8f6fb" stroke="#aa98c5" stroke-width="3"/></g><circle cx="1295" cy="205" r="42" fill="#76629a"/><path d="M1275 205h40M1295 185v40" stroke="#fff" stroke-width="6"/><text x="1295" y="285" class="h1" text-anchor="middle">PERSISTENTE</text><rect x="1135" y="320" width="320" height="72" rx="12" fill="#18232c"/><text x="1295" y="365" font-family="Courier New" font-size="21" fill="#fff" text-anchor="middle">nohup comando &amp;</text><text x="1295" y="455" class="copy" text-anchor="middle"><tspan x="1295" dy="0">Continúa tras desconectarte</tspan><tspan x="1295" dy="34">La salida va a nohup.out</tspan><tspan x="1295" dy="34">Útil para tareas largas</tspan></text><path d="M520 395H585" class="line" marker-end="url(#arrow)"/><path d="M1015 395H1080" class="line" marker-end="url(#arrow)"/><rect x="90" y="690" width="1420" height="130" rx="20" fill="#1f6d7a"/><text x="130" y="730" class="white" text-anchor="start">HERRAMIENTAS PARA OBSERVAR Y CONTROLAR</text><text x="130" y="770" class="whiteS" text-anchor="start">ps y top muestran procesos · kill PID termina un proceso · fg/bg cambian el plano · screen y tmux conservan sesiones</text><text x="130" y="800" class="whiteS" text-anchor="start">En un cluster, los análisis pesados deben enviarse al scheduler.</text></svg>