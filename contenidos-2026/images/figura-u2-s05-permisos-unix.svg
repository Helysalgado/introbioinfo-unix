<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Cómo leer los permisos de Unix</title><desc id="desc">Descomposición de los permisos -rwxr-xr-- y su forma numérica 754.</desc><defs><filter id="shadow" x="-12%" y="-12%" width="124%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#52738f"/></marker><marker id="arrowT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#1f6d7a"/></marker><style>.title{font:700 42px Arial;fill:#17365d}.subtitle{font:400 20px Arial;fill:#526270}.h1{font:700 27px Arial;fill:#17365d}.h2{font:700 22px Arial;fill:#17365d}.copy{font:400 18px Arial;fill:#34495e}.small{font:400 15px Arial;fill:#526270}.label{font:700 18px Arial;fill:#17365d}.code{font:700 25px 'Courier New';fill:#17365d}.codeS{font:700 17px 'Courier New';fill:#17365d}.white{font:700 20px Arial;fill:#fff}.whiteS{font:400 16px Arial;fill:#eaf6f7}.num{font:700 22px Arial;fill:#fff;text-anchor:middle;dominant-baseline:middle}.line{fill:none;stroke:#52738f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="58" class="title" text-anchor="middle">Cómo leer los permisos de Unix</text><text x="800" y="95" class="subtitle" text-anchor="middle">La cadena de ls -l indica el tipo de objeto y los permisos del dueño, el grupo y los demás usuarios.</text><text x="800" y="170" class="code" text-anchor="middle">-rwxr-xr--</text><g><rect x="190" y="255" width="110" height="95" rx="18" fill="#bd7c1b"/><text x="245" y="315" font-family="Courier New" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">-</text><text x="245" y="395" class="h2" text-anchor="middle">TIPO</text><rect x="380" y="255" width="240" height="95" rx="18" fill="#2878a9"/><text x="500" y="315" font-family="Courier New" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">rwx</text><text x="500" y="395" class="h2" text-anchor="middle">DUEÑO</text><rect x="680" y="255" width="240" height="95" rx="18" fill="#208b82"/><text x="800" y="315" font-family="Courier New" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">r-x</text><text x="800" y="395" class="h2" text-anchor="middle">GRUPO</text><rect x="980" y="255" width="240" height="95" rx="18" fill="#76629a"/><text x="1100" y="315" font-family="Courier New" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">r--</text><text x="1100" y="395" class="h2" text-anchor="middle">OTROS</text></g><line x1="380" y1="445" x2="1220" y2="445" stroke="#52738f" stroke-width="4"/><g filter="url(#shadow)"><rect x="150" y="480" width="400" height="220" rx="20" fill="#f3f8fc" stroke="#8bb4cf" stroke-width="3"/></g><text x="350" y="530" class="h2" text-anchor="middle">Permisos</text><text x="350" y="575" class="copy" text-anchor="middle"><tspan x="350" dy="0">r = leer = 4</tspan><tspan x="350" dy="34">w = escribir = 2</tspan><tspan x="350" dy="34">x = ejecutar = 1</tspan></text><g filter="url(#shadow)"><rect x="600" y="480" width="370" height="220" rx="20" fill="#f1faf9" stroke="#7ebdb8" stroke-width="3"/></g><text x="785" y="530" class="h2" text-anchor="middle">Suma por categoría</text><text x="785" y="575" class="copy" text-anchor="middle"><tspan x="785" dy="0">rwx = 4 + 2 + 1 = 7</tspan><tspan x="785" dy="34">r-x = 4 + 0 + 1 = 5</tspan><tspan x="785" dy="34">r-- = 4 + 0 + 0 = 4</tspan></text><g filter="url(#shadow)"><rect x="1020" y="480" width="430" height="220" rx="20" fill="#f8f6fb" stroke="#aa98c5" stroke-width="3"/></g><text x="1235" y="530" class="h2" text-anchor="middle">Forma numérica</text><text x="1235" y="625" font-family="Courier New" font-size="62" font-weight="700" fill="#17365d" text-anchor="middle">754</text><rect x="150" y="760" width="1300" height="75" rx="18" fill="#1f6d7a"/><text x="800" y="807" class="white" text-anchor="middle">chmod 754 script.sh → dueño: rwx · grupo: r-x · otros: r--</text></svg>