<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Las tres comprobaciones que hay entre un archivo y su ejecución</title>
  <desc id="desc">Un archivo de texto con comandos dentro atraviesa tres comprobaciones antes de ejecutarse. Primero, la invocación: si se escribe solo el nombre del archivo el sistema lo busca en los directorios de programas y no lo encuentra, porque el directorio actual no está entre ellos; con punto barra delante se le indica que está aquí mismo. Segundo, el permiso: si el archivo no tiene marca de ejecución, el sistema se niega con permiso denegado. Tercero, el intérprete: la primera línea del archivo, que empieza por almohadilla y admiración, le dice al sistema qué programa debe leer las órdenes; si esa línea falta o está mal escrita el sistema responde que no encuentra el intérprete. Superadas las tres, los comandos se ejecutan en orden, de arriba abajo, sin que nadie mire.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11z" fill="#2878a9"/>
    </marker>
    <marker id="arrowgrn" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11z" fill="#1e7a52"/></marker>
    <marker id="arrowred" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11z" fill="#b03a2e"/>
    </marker>
    <style>
      .title{font:700 42px Arial;fill:#17365d}
      .subtitle{font:400 20px Arial;fill:#526270}
      .tag{font:700 15px Arial;fill:#fff}
      .num{font:700 26px Arial;fill:#fff}
      .copy{font:400 16px Arial;fill:#34495e}
      .small{font:400 14px Arial;fill:#526270}
      .code{font:400 15px 'Courier New';fill:#17365d}
      .err{font:400 14px 'Courier New';fill:#b03a2e}
      .h3{font:700 19px Arial;fill:#17365d}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <text x="800" y="56" class="title" text-anchor="middle">Qué comprueba el sistema antes de ejecutar tu archivo</text>
  <text x="800" y="92" class="subtitle" text-anchor="middle">Tres comprobaciones, tres mensajes de error distintos. Ninguno habla de si tus comandos son correctos.</text>

  <!-- archivo de partida -->
  <g filter="url(#shadow)"><rect x="45" y="300" width="200" height="230" rx="14" fill="#f7fafc" stroke="#c9d6e2"/></g>
  <text x="145" y="336" class="h3" text-anchor="middle">tu archivo</text>
  <rect x="70" y="356" width="150" height="140" rx="6" fill="#fff" stroke="#c9d6e2"/>
  <text x="84" y="380" class="code">#!/bin/bash</text>
  <text x="84" y="406" class="code">grep ...</text>
  <text x="84" y="428" class="code">cut  ...</text>
  <text x="84" y="450" class="code">sort ...</text>
  <text x="145" y="522" class="small" text-anchor="middle">texto, sin más</text>

  <path d="M255 415 L300 415" stroke="#2878a9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== 1. invocación ===== -->
  <g filter="url(#shadow)"><rect x="310" y="230" width="380" height="390" rx="16" fill="#eef5fb" stroke="#2878a9"/></g>
  <circle cx="348" cy="268" r="22" fill="#2878a9"/>
  <text x="348" y="277" class="num" text-anchor="middle">1</text>
  <text x="384" y="276" class="h3">¿Dónde está?</text>
  <text x="336" y="312" class="copy">El sistema busca los programas en</text>
  <text x="336" y="334" class="copy">unos directorios fijos. El directorio</text>
  <text x="336" y="356" class="copy">actual <tspan font-weight="700">no</tspan> está entre ellos.</text>

  <rect x="336" y="382" width="330" height="76" rx="8" fill="#fdf1ef" stroke="#b03a2e"/>
  <text x="352" y="408" class="code">$ analizar-genoma.sh</text>
  <text x="352" y="440" class="err">command not found</text>

  <rect x="336" y="472" width="330" height="76" rx="8" fill="#eef8f2" stroke="#1e7a52"/>
  <text x="352" y="498" class="code">$ ./analizar-genoma.sh</text>
  <text x="352" y="530" class="small">«este de aquí, el que yo digo»</text>

  <text x="336" y="578" class="small">Dejar fuera el directorio actual</text><text x="336" y="596" class="small">es una decisión de seguridad.</text>

  <path d="M700 415 L740 415" stroke="#2878a9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== 2. permiso ===== -->
  <g filter="url(#shadow)"><rect x="750" y="230" width="380" height="390" rx="16" fill="#fdf7e8" stroke="#d18b16"/></g>
  <circle cx="788" cy="268" r="22" fill="#d18b16"/>
  <text x="788" y="277" class="num" text-anchor="middle">2</text>
  <text x="824" y="276" class="h3">¿Puede ejecutarse?</text>
  <text x="776" y="312" class="copy">Un archivo de datos y uno ejecutable</text>
  <text x="776" y="334" class="copy">son cosas distintas, y hay que</text>
  <text x="776" y="356" class="copy">declararlo (U2, S5).</text>

  <rect x="776" y="382" width="330" height="76" rx="8" fill="#fdf1ef" stroke="#b03a2e"/>
  <text x="792" y="408" class="code">-rw-r--r--   sin x</text>
  <text x="792" y="440" class="err">Permission denied</text>

  <rect x="776" y="472" width="330" height="76" rx="8" fill="#eef8f2" stroke="#1e7a52"/>
  <text x="792" y="498" class="code">chmod +x  →  -rwxr-xr-x</text>
  <text x="792" y="530" class="small">lo mínimo necesario, nunca 777</text>

  <text x="776" y="578" class="small">Comprobar siempre con ls -l:</text><text x="776" y="596" class="small">la x tiene que verse.</text>

  <path d="M1140 415 L1180 415" stroke="#2878a9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== 3. intérprete ===== -->
  <g filter="url(#shadow)"><rect x="1190" y="230" width="365" height="390" rx="16" fill="#f3eefa" stroke="#7d5ba6"/></g>
  <circle cx="1228" cy="268" r="22" fill="#7d5ba6"/>
  <text x="1228" y="277" class="num" text-anchor="middle">3</text>
  <text x="1264" y="276" class="h3">¿Quién lo interpreta?</text>
  <text x="1216" y="312" class="copy">En la terminal el intérprete eras tú.</text>
  <text x="1216" y="334" class="copy">En un archivo que corre solo, nadie</text>
  <text x="1216" y="356" class="copy">lo ha decidido.</text>

  <rect x="1216" y="382" width="316" height="76" rx="8" fill="#fdf1ef" stroke="#b03a2e"/>
  <text x="1232" y="408" class="code">#!/bin/basj</text>
  <text x="1232" y="440" class="err">bad interpreter</text>

  <rect x="1216" y="472" width="316" height="76" rx="8" fill="#eef8f2" stroke="#1e7a52"/>
  <text x="1232" y="498" class="code">#!/bin/bash</text>
  <text x="1232" y="530" class="small">primera línea, primera columna</text>

  <text x="1216" y="578" class="small">bash script.sh salta el 2 y el 3:</text><text x="1216" y="596" class="small">sirve para diagnosticar.</text>

  <!-- salida -->
  <path d="M1372 628 L1372 668" stroke="#1e7a52" stroke-width="3" fill="none"/>
  <path d="M1372 668 L200 668" stroke="#1e7a52" stroke-width="3" fill="none"/>
  <path d="M200 668 L200 702" stroke="#1e7a52" stroke-width="3" fill="none" marker-end="url(#arrowgrn)"/>

  <rect x="55" y="716" width="1490" height="128" rx="14" fill="#eef8f2" stroke="#1e7a52"/>
  <text x="85" y="756" class="h3">Superadas las tres, los comandos se ejecutan en orden, de arriba abajo — y sin que nadie mire.</text>
  <text x="85" y="792" class="copy">Ahí empieza el problema nuevo de esta unidad: los avisos pasan, la última línea se imprime y el resultado <tspan font-style="italic">parece</tspan> bueno.</text>
  <text x="85" y="822" class="copy">Un script puede terminar con éxito y no haber hecho nada. Comprobarlo es el contenido de la sesión siguiente.</text>
</svg>
