<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Anatomía de una pregunta biológica compleja</title>
  <desc id="desc">Una pregunta biológica —cuántos genes hay en la cadena negativa de un replicón concreto— se descompone en cuatro partes antes de escribir ningún comando. Primera, qué registros: los de tipo gene. Segunda, qué columnas: la del tipo, la de la cadena y la del replicón. Tercera, qué condición: que el tipo sea gene y además la cadena sea negativa y además el replicón sea el elegido. Cuarta, qué cálculo: contar. Debajo, esas cuatro partes se traducen a una expresión ejecutable en la que cada componente ocupa un lugar visible. Una franja final indica que las tres primeras partes se piensan en español, que la sintaxis aparece solo al final, y que una pregunta que no se puede descomponer así todavía no está lista para convertirse en un comando.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11z" fill="#2878a9"/>
    </marker>
    <style>
      .title{font:700 42px Arial;fill:#17365d}
      .subtitle{font:400 20px Arial;fill:#526270}
      .tag{font:700 16px Arial;fill:#fff}
      .copy{font:400 18px Arial;fill:#34495e}
      .small{font:400 15px Arial;fill:#526270}
      .code{font:400 20px 'Courier New';fill:#17365d}
      .h3{font:700 20px Arial;fill:#17365d}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <text x="800" y="56" class="title" text-anchor="middle">Anatomía de una pregunta compleja</text>
  <text x="800" y="92" class="subtitle" text-anchor="middle">Cuatro decisiones en español antes de escribir un solo símbolo. La sintaxis es lo último.</text>

  <!-- LA PREGUNTA -->
  <rect x="300" y="130" width="1000" height="70" rx="14" fill="#17365d"/>
  <text x="800" y="175" class="tag" text-anchor="middle" font-size="22">«¿Cuántos genes hay en la cadena negativa del replicón NC_000913.3?»</text>

  <line x1="800" y1="205" x2="800" y2="240" stroke="#2878a9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- CUATRO PARTES -->
  <g filter="url(#shadow)"><rect x="60" y="255" width="350" height="230" rx="16" fill="#eef5fb" stroke="#2878a9"/></g>
  <rect x="60" y="255" width="230" height="32" rx="10" fill="#2878a9"/>
  <text x="80" y="278" class="tag">1 · QUÉ REGISTROS</text>
  <text x="90" y="325" class="copy">De todas las líneas del</text>
  <text x="90" y="351" class="copy">archivo, ¿cuáles hablan del</text>
  <text x="90" y="377" class="copy">objeto que me interesa?</text>
  <rect x="90" y="400" width="290" height="52" rx="10" fill="#fff" stroke="#2878a9" stroke-width="2"/>
  <text x="110" y="434" class="code">tipo = gene</text>

  <g filter="url(#shadow)"><rect x="440" y="255" width="350" height="230" rx="16" fill="#eef8f2" stroke="#8cc9a9"/></g>
  <rect x="440" y="255" width="230" height="32" rx="10" fill="#1e7a52"/>
  <text x="460" y="278" class="tag">2 · QUÉ COLUMNAS</text>
  <text x="470" y="325" class="copy">¿Dónde vive cada dato que</text>
  <text x="470" y="351" class="copy">necesito para decidir?</text>
  <rect x="470" y="374" width="290" height="78" rx="10" fill="#fff" stroke="#8cc9a9" stroke-width="2"/>
  <text x="490" y="402" class="code" font-size="17">1 replicón · 3 tipo</text>
  <text x="490" y="432" class="code" font-size="17">7 cadena</text>

  <g filter="url(#shadow)"><rect x="820" y="255" width="350" height="230" rx="16" fill="#fdf7e8" stroke="#d18b16"/></g>
  <rect x="820" y="255" width="230" height="32" rx="10" fill="#d18b16"/>
  <text x="840" y="278" class="tag">3 · QUÉ CONDICIÓN</text>
  <text x="850" y="325" class="copy">¿Qué tiene que cumplir una</text>
  <text x="850" y="351" class="copy">línea, toda a la vez?</text>
  <rect x="850" y="374" width="290" height="78" rx="10" fill="#fff" stroke="#d18b16" stroke-width="2"/>
  <text x="870" y="402" class="code" font-size="17">tipo = gene   Y</text>
  <text x="870" y="432" class="code" font-size="17">cadena = −   Y   repl. = X</text>

  <g filter="url(#shadow)"><rect x="1200" y="255" width="340" height="230" rx="16" fill="#f3eefa" stroke="#7d5ba6"/></g>
  <rect x="1200" y="255" width="200" height="32" rx="10" fill="#7d5ba6"/>
  <text x="1220" y="278" class="tag">4 · QUÉ CÁLCULO</text>
  <text x="1230" y="325" class="copy">¿Qué hago con las líneas</text>
  <text x="1230" y="351" class="copy">que cumplen la condición?</text>
  <rect x="1230" y="400" width="280" height="52" rx="10" fill="#fff" stroke="#7d5ba6" stroke-width="2"/>
  <text x="1250" y="434" class="code">contar</text>

  <line x1="800" y1="500" x2="800" y2="540" stroke="#2878a9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- LA EXPRESIÓN -->
  <g filter="url(#shadow)"><rect x="140" y="555" width="1320" height="160" rx="16" fill="#f7fafc" stroke="#c9d6e2"/></g>
  <text x="170" y="595" class="h3">Y solo entonces, la expresión</text>
  <text x="170" y="648" class="code" font-size="21">awk -F'\t' '<tspan fill="#2878a9" font-weight="700">$3=="gene"</tspan> &amp;&amp; <tspan fill="#d18b16" font-weight="700">$7=="-"</tspan> &amp;&amp; <tspan fill="#d18b16" font-weight="700">$1=="NC_000913.3"</tspan>' anotacion.gff3 | <tspan fill="#7d5ba6" font-weight="700">wc -l</tspan></text>
  <text x="170" y="690" class="small">Cada color viene de una de las cuatro cajas. Si no puedes señalar de dónde sale un trozo del comando, ese trozo sobra.</text>

  <!-- CIERRE -->
  <rect x="60" y="745" width="1480" height="115" rx="12" fill="#eef5fb" stroke="#2878a9" stroke-width="2"/>
  <text x="95" y="787" class="copy"><tspan font-weight="700">Las tres primeras decisiones son biológicas; solo la cuarta y la sintaxis son técnicas.</tspan></text>
  <text x="95" y="817" class="copy">Una pregunta que todavía no puedes descomponer así no está lista para convertirse en un comando: lo que falta no es sintaxis, es</text>
  <text x="95" y="847" class="copy">precisión sobre qué estás preguntando.</text>
</svg>
