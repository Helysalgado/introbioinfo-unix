<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dónde se detiene alguien que recibe tu proyecto</title>
  <desc id="desc">Recorrido de una persona que recibe el proyecto sin poder preguntar nada. Intenta avanzar por cinco etapas y en cada una se encuentra con una barrera: al abrir el proyecto no sabe qué hace ni por dónde empezar; al querer ejecutar no sabe cómo se llama a la herramienta ni qué espera recibir; al preparar los datos no sabe cómo debe estar organizada la colección; después de ejecutar no sabe si salió bien ni qué mirar para comprobarlo; y al abrir los resultados no sabe qué significa cada columna. Debajo de cada barrera se indica que la respuesta existe, pero vive en la cabeza de quien escribió la herramienta y no en ningún archivo. Una franja inferior señala que ninguna de las cinco barreras es un problema de programación: la herramienta funciona perfectamente en las cinco.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11z" fill="#2878a9"/>
    </marker>
    <style>
      .title{font:700 38px Arial;fill:#17365d}
      .subtitle{font:400 19px Arial;fill:#526270}
      .tag{font:700 14px Arial;fill:#fff}
      .copy{font:400 15px Arial;fill:#34495e}
      .small{font:400 13px Arial;fill:#526270}
      .ask{font:700 16px Arial;fill:#b03a2e}
      .h3{font:700 17px Arial;fill:#17365d}
      .band{font:400 19px Arial;fill:#17365d}
      .num{font:700 22px Arial;fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <text x="800" y="48" class="title" text-anchor="middle">Dónde se detiene alguien que recibe tu proyecto</text>
  <text x="800" y="82" class="subtitle" text-anchor="middle">Cinco barreras. En las cinco, la herramienta funciona perfectamente.</text>

  <!-- persona -->
  <circle cx="90" cy="330" r="24" fill="#2878a9"/>
  <path d="M55 400 q35 -56 70 0 z" fill="#2878a9"/>
  <text x="90" y="440" class="h3" text-anchor="middle">alguien</text>
  <text x="90" y="464" class="small" text-anchor="middle">que no puede</text>
  <text x="90" y="484" class="small" text-anchor="middle">preguntarte nada</text>
  <path d="M140 350 L180 350" stroke="#2878a9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- barreras -->
  <g filter="url(#shadow)"><rect x="195" y="130" width="262" height="290" rx="14" fill="#fdf1ef" stroke="#b03a2e"/></g>
  <circle cx="228" cy="164" r="19" fill="#b03a2e"/><text x="228" y="172" class="num" text-anchor="middle">1</text>
  <text x="258" y="171" class="h3">Abre el proyecto</text>
  <text x="217" y="212" class="ask">«¿qué hace esto?»</text>
  <text x="217" y="242" class="ask">«¿por dónde empiezo?»</text>
  <rect x="217" y="266" width="218" height="130" rx="8" fill="#fff" stroke="#c9d6e2"/>
  <text x="233" y="294" class="small">Ve carpetas y dos scripts.</text>
  <text x="233" y="318" class="small">Ninguno dice para qué sirve</text>
  <text x="233" y="342" class="small">el conjunto.</text>
  <text x="233" y="374" class="copy" font-weight="700">se detiene</text>

  <g filter="url(#shadow)"><rect x="472" y="130" width="262" height="290" rx="14" fill="#fdf1ef" stroke="#b03a2e"/></g>
  <circle cx="505" cy="164" r="19" fill="#b03a2e"/><text x="505" y="172" class="num" text-anchor="middle">2</text>
  <text x="535" y="171" class="h3">Intenta ejecutar</text>
  <text x="494" y="212" class="ask">«¿cómo se llama?»</text>
  <text x="494" y="242" class="ask">«¿qué espera recibir?»</text>
  <rect x="494" y="266" width="218" height="130" rx="8" fill="#fff" stroke="#c9d6e2"/>
  <text x="510" y="294" class="small">Abre el script y lee código</text>
  <text x="510" y="318" class="small">para averiguar qué</text>
  <text x="510" y="342" class="small">argumentos necesita.</text>
  <text x="510" y="374" class="copy" font-weight="700">se detiene</text>

  <g filter="url(#shadow)"><rect x="749" y="130" width="262" height="290" rx="14" fill="#fdf1ef" stroke="#b03a2e"/></g>
  <circle cx="782" cy="164" r="19" fill="#b03a2e"/><text x="782" y="172" class="num" text-anchor="middle">3</text>
  <text x="812" y="171" class="h3">Prepara sus datos</text>
  <text x="771" y="212" class="ask">«¿cómo organizo</text>
  <text x="771" y="238" class="ask">la colección?»</text>
  <rect x="771" y="266" width="218" height="130" rx="8" fill="#fff" stroke="#c9d6e2"/>
  <text x="787" y="294" class="small">El contrato existe —una</text>
  <text x="787" y="318" class="small">carpeta por organismo—</text>
  <text x="787" y="342" class="small">pero no está escrito.</text>
  <text x="787" y="374" class="copy" font-weight="700">se detiene</text>

  <g filter="url(#shadow)"><rect x="1026" y="130" width="262" height="290" rx="14" fill="#fdf1ef" stroke="#b03a2e"/></g>
  <circle cx="1059" cy="164" r="19" fill="#b03a2e"/><text x="1059" y="172" class="num" text-anchor="middle">4</text>
  <text x="1089" y="171" class="h3">Ejecuta</text>
  <text x="1048" y="212" class="ask">«¿salió bien?»</text>
  <text x="1048" y="242" class="ask">«¿qué debo mirar?»</text>
  <rect x="1048" y="266" width="218" height="130" rx="8" fill="#fff" stroke="#c9d6e2"/>
  <text x="1064" y="294" class="small">Ve mensajes que entiende</text>
  <text x="1064" y="318" class="small">quien los escribió, y no</text>
  <text x="1064" y="342" class="small">sabe qué es normal.</text>
  <text x="1064" y="374" class="copy" font-weight="700">se detiene</text>

  <g filter="url(#shadow)"><rect x="1303" y="130" width="262" height="290" rx="14" fill="#fdf1ef" stroke="#b03a2e"/></g>
  <circle cx="1336" cy="164" r="19" fill="#b03a2e"/><text x="1336" y="172" class="num" text-anchor="middle">5</text>
  <text x="1366" y="171" class="h3">Abre el resumen</text>
  <text x="1325" y="212" class="ask">«¿qué significa</text>
  <text x="1325" y="238" class="ask">esta columna?»</text>
  <rect x="1325" y="266" width="218" height="130" rx="8" fill="#fff" stroke="#c9d6e2"/>
  <text x="1341" y="294" class="small">Tiene una tabla correcta</text>
  <text x="1341" y="318" class="small">que no puede usar ni</text>
  <text x="1341" y="342" class="small">citar en ningún sitio.</text>
  <text x="1341" y="374" class="copy" font-weight="700">se detiene</text>

  <!-- donde vive la respuesta -->
  <rect x="195" y="452" width="1370" height="120" rx="14" fill="#fdf7e8" stroke="#d18b16"/>
  <text x="225" y="490" class="h3">En las cinco barreras la respuesta existe. Y en las cinco vive en el mismo sitio:</text>
  <text x="225" y="528" class="copy" font-size="21" font-weight="700">tu cabeza.</text>
  <text x="420" y="528" class="copy">No hay ningún archivo del proyecto donde esté escrita.</text>
  <text x="225" y="558" class="small">Mientras esa persona pueda preguntarte, el proyecto parece completo. En cuanto no pueda, deja de existir.</text>

  <!-- FRANJA -->
  <rect x="55" y="612" width="1510" height="120" rx="14" fill="#eef5fb" stroke="#2878a9"/>
  <text x="85" y="654" class="band"><tspan font-weight="700">Ninguna de las cinco es un problema de programación.</tspan></text>
  <text x="85" y="692" class="copy">La herramienta valida sus entradas, recorre la colección, organiza los resultados y produce el resumen. Funciona. Y aun así, no se puede usar.</text>

  <rect x="55" y="752" width="1510" height="100" rx="14" fill="#eef8f2" stroke="#1e7a52"/>
  <text x="85" y="792" class="band">Lo que falta es <tspan font-weight="700">el contrato escrito</tspan>: qué necesita la herramienta, qué garantiza a cambio y qué no hace.</text>
  <text x="85" y="828" class="small">Eso es documentar. No es una buena práctica: es la condición para que un resultado pueda reproducirse fuera de tu computadora.</text>
</svg>
