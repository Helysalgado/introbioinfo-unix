<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Un objeto biológico puede aparecer en varios registros</title>
  <desc id="desc">A la izquierda, un objeto biológico: un locus del genoma, situado entre las posiciones 190 y 255 de un replicón, identificado de forma estable como locus_tag igual b0001 y con nombre thrL. Es una sola cosa en el organismo. A la derecha, ese mismo objeto aparece en el archivo repartido en varios registros: una línea de tipo gene, con ID igual gene guion b0001, y una línea de tipo CDS, con su propio ID y con el atributo Parent apuntando al ID del gen. Ambas líneas comparten además el mismo locus_tag. Flechas indican que las dos líneas describen el mismo objeto. Una franja inferior resume tres ideas: un registro no es un objeto biológico; un mismo objeto puede aparecer representado por varios registros; y el identificador es lo que permite reconocer que todos hablan del mismo objeto, tanto dentro de un archivo como entre archivos distintos.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11z" fill="#2878a9"/>
    </marker>
    <style>
      .title{font:700 42px Arial;fill:#17365d}
      .subtitle{font:400 20px Arial;fill:#526270}
      .h2{font:700 21px Arial;fill:#17365d}
      .tag{font:700 16px Arial;fill:#fff}
      .copy{font:400 18px Arial;fill:#34495e}
      .small{font:400 15px Arial;fill:#526270}
      .code{font:400 19px 'Courier New';fill:#17365d}
      .codeB{font:700 20px 'Courier New';fill:#17365d}
      .big{font:700 26px 'Courier New';fill:#1e7a52}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <text x="800" y="56" class="title" text-anchor="middle">Un objeto biológico, varios registros</text>
  <text x="800" y="92" class="subtitle" text-anchor="middle">El archivo no guarda genes: guarda líneas. El identificador es lo que permite reconocer que varias líneas hablan del mismo gen.</text>

  <!-- IZQUIERDA: el objeto -->
  <g filter="url(#shadow)"><rect x="60" y="140" width="470" height="440" rx="16" fill="#eef8f2" stroke="#8cc9a9"/></g>
  <rect x="60" y="140" width="330" height="34" rx="10" fill="#1e7a52"/>
  <text x="80" y="165" class="tag">EL OBJETO BIOLÓGICO</text>

  <text x="90" y="212" class="copy">Un locus del genoma. Una sola cosa</text>
  <text x="90" y="238" class="copy">en el organismo.</text>

  <!-- esquema del locus -->
  <rect x="90" y="266" width="410" height="26" rx="4" fill="#dfe8ee"/>
  <rect x="150" y="266" width="230" height="26" rx="4" fill="#8cc9a9" stroke="#1e7a52" stroke-width="2"/>
  <text x="152" y="316" class="small">190</text>
  <text x="356" y="316" class="small">255</text>
  <text x="90" y="345" class="small">replicón NC_000913.3</text>

  <rect x="90" y="370" width="410" height="60" rx="10" fill="#fff" stroke="#1e7a52" stroke-width="2"/>
  <text x="110" y="410" class="big">locus_tag = b0001</text>
  <rect x="90" y="444" width="410" height="52" rx="10" fill="#fff" stroke="#8cc9a9" stroke-width="2"/>
  <text x="110" y="478" class="code">Name = thrL</text>

  <text x="90" y="536" class="small">El `locus_tag` es estable: identifica</text>
  <text x="90" y="558" class="small">al locus, no a una línea del archivo.</text>

  <!-- DERECHA: los registros -->
  <g filter="url(#shadow)"><rect x="700" y="140" width="840" height="440" rx="16" fill="#f7fafc" stroke="#c9d6e2"/></g>
  <rect x="700" y="140" width="440" height="34" rx="10" fill="#526270"/>
  <text x="720" y="165" class="tag">SUS REGISTROS EN EL ARCHIVO</text>

  <text x="730" y="212" class="copy">Dos líneas distintas. Cada una describe una faceta del mismo locus.</text>

  <rect x="730" y="240" width="780" height="120" rx="10" fill="#fff" stroke="#2878a9" stroke-width="2"/>
  <rect x="730" y="240" width="130" height="30" rx="8" fill="#2878a9"/>
  <text x="750" y="262" class="tag" font-size="15">TIPO gene</text>
  <text x="750" y="302" class="code">ID=gene-b0001</text>
  <text x="750" y="334" class="code" fill="#1e7a52">locus_tag=b0001</text>
  <text x="1080" y="302" class="small">Su `ID` lo identifica dentro del archivo.</text>
  <text x="1080" y="334" class="small">Su `locus_tag` lo liga al objeto biológico.</text>

  <rect x="730" y="400" width="780" height="140" rx="10" fill="#fff" stroke="#7d5ba6" stroke-width="2"/>
  <rect x="730" y="400" width="130" height="30" rx="8" fill="#7d5ba6"/>
  <text x="750" y="422" class="tag" font-size="15">TIPO CDS</text>
  <text x="750" y="462" class="code">ID=cds-YP_025292.1</text>
  <text x="750" y="494" class="codeB" fill="#7d5ba6">Parent=gene-b0001</text>
  <text x="750" y="524" class="code" fill="#1e7a52">locus_tag=b0001</text>
  <text x="1080" y="462" class="small">Tiene identidad propia…</text>
  <text x="1080" y="494" class="small">…pero declara de quién depende.</text>
  <text x="1080" y="524" class="small">Y comparte el mismo locus.</text>

  <!-- enlace Parent -> ID -->
  <path d="M745 494 L706 494 C 686 494, 686 302, 736 302" fill="none" stroke="#7d5ba6" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="1180" y="386" class="small" fill="#7d5ba6">`Parent` apunta al `ID` del gen: una relación explícita</text>

  <!-- flechas objeto -> registros -->
  <path d="M540 340 L690 280" fill="none" stroke="#2878a9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M540 400 L690 460" fill="none" stroke="#2878a9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- FRANJA INFERIOR -->
  <g filter="url(#shadow)"><rect x="60" y="620" width="1480" height="230" rx="16" fill="#eef5fb" stroke="#2878a9"/></g>
  <text x="90" y="666" class="h2">Tres ideas que conviene no olvidar</text>

  <rect x="90" y="690" width="450" height="130" rx="10" fill="#fff" stroke="#c9d6e2" stroke-width="2"/>
  <text x="110" y="726" class="copy" font-weight="700">Un registro no es un objeto.</text>
  <text x="110" y="758" class="small">Una línea del archivo es una afirmación</text>
  <text x="110" y="780" class="small">sobre un objeto, no el objeto mismo.</text>

  <rect x="575" y="690" width="450" height="130" rx="10" fill="#fff" stroke="#c9d6e2" stroke-width="2"/>
  <text x="595" y="726" class="copy" font-weight="700">Un objeto tiene varios registros.</text>
  <text x="595" y="758" class="small">Por eso contar líneas no es contar</text>
  <text x="595" y="780" class="small">genes: hay que contar identificadores.</text>

  <rect x="1060" y="690" width="450" height="130" rx="10" fill="#fff" stroke="#2878a9" stroke-width="2"/>
  <text x="1080" y="726" class="copy" font-weight="700">El identificador los reúne.</text>
  <text x="1080" y="758" class="small">Es el lenguaje común que permite seguir</text>
  <text x="1080" y="780" class="small">un objeto dentro de un archivo y entre archivos.</text>
</svg>
