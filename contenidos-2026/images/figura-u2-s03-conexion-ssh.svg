<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Conexión cliente–servidor mediante SSH</title><desc id="desc">Laptop cliente conectada mediante SSH a un servidor remoto.</desc><defs><filter id="shadow" x="-12%" y="-12%" width="124%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#52738f"/></marker><marker id="arrowT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#1f6d7a"/></marker><style>.title{font:700 42px Arial;fill:#17365d}.subtitle{font:400 20px Arial;fill:#526270}.h1{font:700 27px Arial;fill:#17365d}.h2{font:700 22px Arial;fill:#17365d}.copy{font:400 18px Arial;fill:#34495e}.small{font:400 15px Arial;fill:#526270}.label{font:700 18px Arial;fill:#17365d}.code{font:700 25px 'Courier New';fill:#17365d}.codeS{font:700 17px 'Courier New';fill:#17365d}.white{font:700 20px Arial;fill:#fff}.whiteS{font:400 16px Arial;fill:#eaf6f7}.num{font:700 22px Arial;fill:#fff;text-anchor:middle;dominant-baseline:middle}.line{fill:none;stroke:#52738f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="58" class="title" text-anchor="middle">Conexión cliente–servidor mediante SSH</text><text x="800" y="95" class="subtitle" text-anchor="middle">Tu computadora controla una sesión remota a través de un canal cifrado.</text><g filter="url(#shadow)"><rect x="100" y="235" width="360" height="350" rx="20" fill="#f3f8fc" stroke="#8bb4cf" stroke-width="3"/></g><rect x="175" y="300" width="210" height="130" rx="10" fill="#fff" stroke="#2878a9" stroke-width="4"/><path d="M150 455H410L375 500H185z" fill="#dcecf7" stroke="#2878a9" stroke-width="3"/><text x="280" y="550" class="h2" text-anchor="middle">Tu computadora</text><text x="280" y="580" class="small" text-anchor="middle">CLIENTE</text><text x="195" y="365" font-family="Courier New" font-size="18" fill="#17365d">ssh usuario@servidor</text>
