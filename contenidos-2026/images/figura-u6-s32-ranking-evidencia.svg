<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="t d">
  <title id="t">Ranking de evidencia</title>
  <desc id="d">Tres peldaños: métricas sueltas, integración con anotación, y ranking argumentado de candidatos. Una flecha lateral indica que el primer hit no siempre es el más útil.</desc>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17365d" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 34px Arial;fill:#17365d}
      .sub{font:400 18px Arial;fill:#526270}
      .h{font:700 20px Arial;fill:#ffffff}
      .copy{font:400 16px Arial;fill:#34495e}
      .small{font:400 14px Arial;fill:#526270}
      .box{font:700 15px Arial;fill:#17365d}
    </style>
  </defs>
  <rect width="1600" height="780" fill="#fff"/>
  <text x="800" y="48" class="title" text-anchor="middle">De métricas sueltas a un ranking argumentado</text>
  <text x="800" y="80" class="sub" text-anchor="middle">El producto de S32 no es «el mejor hit»: es una jerarquía justificada</text>

  <!-- peldaño 1 -->
  <g filter="url(#sh)"><rect x="200" y="120" width="1000" height="140" rx="14" fill="#eef4fa" stroke="#17365d" stroke-width="2"/></g>
  <rect x="200" y="120" width="1000" height="40" rx="14" fill="#17365d"/>
  <rect x="200" y="144" width="1000" height="16" fill="#17365d"/>
  <text x="700" y="148" class="h" text-anchor="middle">1 · Métricas sueltas</text>
  <rect x="240" y="185" width="180" height="50" rx="8" fill="#fff" stroke="#1e7a52" stroke-width="2"/>
  <text x="330" y="215" class="box" text-anchor="middle">identidad</text>
  <rect x="450" y="185" width="180" height="50" rx="8" fill="#fff" stroke="#d18b16" stroke-width="2"/>
  <text x="540" y="215" class="box" text-anchor="middle">cobertura</text>
  <rect x="660" y="185" width="180" height="50" rx="8" fill="#fff" stroke="#17365d" stroke-width="2"/>
  <text x="750" y="215" class="box" text-anchor="middle">bit score</text>
  <rect x="870" y="185" width="180" height="50" rx="8" fill="#fff" stroke="#b03a2e" stroke-width="2"/>
  <text x="960" y="215" class="box" text-anchor="middle">E-value</text>
  <text x="1100" y="215" class="small">cada una sola</text>

  <!-- flecha -->
  <path d="M700 270 L700 310" stroke="#17365d" stroke-width="4" marker-end="url(#a)"/>

  <!-- peldaño 2 -->
  <g filter="url(#sh)"><rect x="280" y="320" width="840" height="140" rx="14" fill="#fff8e8" stroke="#d18b16" stroke-width="2"/></g>
  <rect x="280" y="320" width="840" height="40" rx="14" fill="#d18b16"/>
  <rect x="280" y="344" width="840" height="16" fill="#d18b16"/>
  <text x="700" y="348" class="h" text-anchor="middle">2 · Integración</text>
  <text x="700" y="395" class="copy" text-anchor="middle">las cuatro se leen juntas</text>
  <text x="700" y="425" class="copy" text-anchor="middle">+ anotación + procedencia de la base + tu pregunta</text>

  <path d="M700 470 L700 510" stroke="#17365d" stroke-width="4" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#17365d"/></marker></defs>

  <!-- peldaño 3 -->
  <g filter="url(#sh)"><rect x="360" y="520" width="680" height="160" rx="14" fill="#eef8f2" stroke="#1e7a52" stroke-width="2"/></g>
  <rect x="360" y="520" width="680" height="40" rx="14" fill="#1e7a52"/>
  <rect x="360" y="544" width="680" height="16" fill="#1e7a52"/>
  <text x="700" y="548" class="h" text-anchor="middle">3 · Ranking de evidencia</text>
  <text x="700" y="595" class="copy" text-anchor="middle">1º candidato mejor sustentado (con argumentos)</text>
  <text x="700" y="625" class="copy" text-anchor="middle">2º representante no redundante</text>
  <text x="700" y="655" class="copy" text-anchor="middle">& descartes documentados</text>

  <!-- lateral -->
  <g filter="url(#sh)"><rect x="1280" y="320" width="260" height="200" rx="14" fill="#fdf1ef" stroke="#b03a2e" stroke-width="2"/></g>
  <text x="1410" y="380" style="font:700 16px Arial;fill:#b03a2e" text-anchor="middle">Cuidado</text>
  <text x="1410" y="420" class="copy" text-anchor="middle">el primer hit</text>
  <text x="1410" y="450" class="copy" text-anchor="middle">de BLAST no</text>
  <text x="1410" y="480" class="copy" text-anchor="middle">siempre es el</text>
  <text x="1410" y="510" style="font:700 16px Arial;fill:#b03a2e" text-anchor="middle">más útil</text>
</svg>
