<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cliente, servidor y protocolos</title>
  <desc id="desc">Una computadora cliente se comunica con un servidor mediante HTTPS para web y descargas, SSH para terminal remota y SFTP sobre SSH para transferir archivos. FTP plano aparece como una opción sin cifrado que no debe utilizarse en el curso.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBoth" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12z" fill="#52738f"/>
    </marker>
    <style>
      .title{font:700 42px Arial;fill:#17365d}
      .subtitle{font:400 20px Arial;fill:#526270}
      .cardTitle{font:700 25px Arial;fill:#17365d}
      .cardCopy{font:400 18px Arial;fill:#34495e}
      .protocol{font:700 23px 'Courier New';fill:#17365d}
      .task{font:700 20px Arial;fill:#17365d}
      .status{font:700 17px Arial;fill:#1f6d7a}
      .statusBad{font:700 17px Arial;fill:#a64b38}
      .white{font:700 21px Arial;fill:#fff}
      .whiteSmall{font:400 17px Arial;fill:#eaf6f7}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" class="title" text-anchor="middle">Cliente, servidor y protocolos</text>
  <text x="800" y="95" class="subtitle" text-anchor="middle">El protocolo define cómo viaja cada tipo de información entre dos computadoras.</text>

  <!-- Communication lines behind the cards -->
  <g fill="none" stroke="#52738f" stroke-width="4" marker-start="url(#arrowBoth)" marker-end="url(#arrowBoth)">
    <path d="M350 230H1250"/>
    <path d="M350 355H1250"/>
    <path d="M350 480H1250"/>
  </g>
  <path d="M350 605H1250" fill="none" stroke="#b5654d" stroke-width="4" stroke-dasharray="10 9" marker-start="url(#arrowBoth)" marker-end="url(#arrowBoth)"/>

  <!-- Client card -->
  <g filter="url(#shadow)">
    <rect x="65" y="180" width="300" height="480" rx="24" fill="#f3f8fc" stroke="#8bb4cf" stroke-width="3"/>
  </g>
  <rect x="128" y="260" width="174" height="116" rx="14" fill="#fff" stroke="#2b7fb1" stroke-width="4"/>
  <path d="M110 402H320L285 444H145Z" fill="#dcecf6" stroke="#2b7fb1" stroke-width="4"/>
  <text x="215" y="505" class="cardTitle" text-anchor="middle">TU COMPUTADORA</text>
  <text x="215" y="545" class="cardCopy" text-anchor="middle">CLIENTE</text>
  <text x="215" y="580" class="cardCopy" text-anchor="middle">Inicia la solicitud</text>
  <text x="215" y="612" class="cardCopy" text-anchor="middle">y recibe la respuesta</text>

  <!-- Server card -->
  <g filter="url(#shadow)">
    <rect x="1235" y="180" width="300" height="480" rx="24" fill="#f8f6fb" stroke="#aa98c5" stroke-width="3"/>
  </g>
  <g fill="#efeaf5" stroke="#7f68a6" stroke-width="4">
    <rect x="1310" y="255" width="150" height="72" rx="12"/>
    <rect x="1310" y="345" width="150" height="72" rx="12"/>
    <rect x="1310" y="435" width="150" height="72" rx="12"/>
  </g>
  <g fill="#7f68a6">
    <circle cx="1437" cy="291" r="7"/>
    <circle cx="1437" cy="381" r="7"/>
    <circle cx="1437" cy="471" r="7"/>
  </g>
  <text x="1385" y="555" class="cardTitle" text-anchor="middle">SERVIDOR REMOTO</text>
  <text x="1385" y="595" class="cardCopy" text-anchor="middle">Ofrece servicios</text>
  <text x="1385" y="627" class="cardCopy" text-anchor="middle">y responde</text>

  <!-- Protocol rows -->
  <g filter="url(#shadow)">
    <rect x="410" y="175" width="780" height="110" rx="20" fill="#f3f8fc" stroke="#8bb4cf" stroke-width="3"/>
  </g>
  <rect x="445" y="205" width="170" height="50" rx="14" fill="#dcecf6"/>
  <text x="530" y="238" class="protocol" text-anchor="middle">HTTPS</text>
  <text x="790" y="220" class="task" text-anchor="middle">WEB Y DESCARGAS</text>
  <text x="790" y="252" class="cardCopy" text-anchor="middle">Consultar páginas y obtener archivos</text>
  <text x="1080" y="238" class="status" text-anchor="middle">CANAL CIFRADO</text>

  <g filter="url(#shadow)">
    <rect x="410" y="300" width="780" height="110" rx="20" fill="#f1faf9" stroke="#7ebdb8" stroke-width="3"/>
  </g>
  <rect x="445" y="330" width="170" height="50" rx="14" fill="#d9f0ed"/>
  <text x="530" y="363" class="protocol" text-anchor="middle">SSH</text>
  <text x="790" y="345" class="task" text-anchor="middle">TERMINAL REMOTA</text>
  <text x="790" y="377" class="cardCopy" text-anchor="middle">Trabajar mediante comandos en el servidor</text>
  <text x="1080" y="363" class="status" text-anchor="middle">CANAL CIFRADO</text>

  <g filter="url(#shadow)">
    <rect x="410" y="425" width="780" height="110" rx="20" fill="#f6f8fc" stroke="#9caed1" stroke-width="3"/>
  </g>
  <rect x="445" y="455" width="170" height="50" rx="14" fill="#e7ebf5"/>
  <text x="530" y="488" class="protocol" text-anchor="middle">SFTP</text>
  <text x="790" y="470" class="task" text-anchor="middle">TRANSFERIR ARCHIVOS</text>
  <text x="790" y="502" class="cardCopy" text-anchor="middle">Funciona sobre el canal seguro de SSH</text>
  <text x="1080" y="488" class="status" text-anchor="middle">CANAL CIFRADO</text>

  <g filter="url(#shadow)">
    <rect x="410" y="550" width="780" height="110" rx="20" fill="#fff8ef" stroke="#d6a15b" stroke-width="3" stroke-dasharray="10 7"/>
  </g>
  <rect x="445" y="580" width="170" height="50" rx="14" fill="#f8e8d3"/>
  <text x="530" y="613" class="protocol" text-anchor="middle">FTP</text>
  <text x="790" y="595" class="task" text-anchor="middle">TRANSFERENCIA PLANA</text>
  <text x="790" y="627" class="cardCopy" text-anchor="middle">No protege credenciales ni contenido</text>
  <text x="1080" y="613" class="statusBad" text-anchor="middle">SIN CIFRADO</text>

  <!-- Bottom takeaway -->
  <rect x="120" y="730" width="1360" height="110" rx="20" fill="#1f6d7a"/>
  <text x="800" y="775" class="white" text-anchor="middle">EL PROTOCOLO DEPENDE DE LA TAREA</text>
  <text x="800" y="812" class="whiteSmall" text-anchor="middle">En el curso: SSH para acceso remoto · SFTP para transferir archivos · FTP plano no se utiliza</text>
</svg>
