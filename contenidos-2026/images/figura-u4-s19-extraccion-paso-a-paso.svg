<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Extracción paso a paso de un identificador incrustado en el texto</title>
  <desc id="desc">Cuatro pasos sucesivos. Primero, la línea completa del GFF3, con sus nueve columnas y el campo de atributos al final. Segundo, grep con la opción o devuelve únicamente el fragmento que coincide con el patrón, es decir el par locus_tag igual b0001, en lugar de la línea entera. Tercero, cut con el signo igual como delimitador se queda con el segundo campo, el valor b0001. Cuarto, sort con la opción u produce la lista de identificadores distintos. Un recuadro inferior advierte sobre el patrón demasiado ambicioso: si en lugar de acotar el valor hasta el punto y coma se usa punto asterisco, la extracción se lleva también el resto de los atributos de la línea.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11z" fill="#2878a9"/>
    </marker>
    <style>
      .title{font:700 42px Arial;fill:#17365d}
      .subtitle{font:400 20px Arial;fill:#526270}
      .h2{font:700 20px Arial;fill:#fff}
      .copy{font:400 18px Arial;fill:#34495e}
      .small{font:400 15px Arial;fill:#526270}
      .code{font:400 19px 'Courier New';fill:#17365d}
      .codeB{font:700 20px 'Courier New';fill:#17365d}
      .lbl{font:700 18px Arial;fill:#17365d}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <text x="800" y="56" class="title" text-anchor="middle">De la línea correcta al dato correcto</text>
  <text x="800" y="92" class="subtitle" text-anchor="middle">Seleccionar una línea y extraer un identificador son dos operaciones distintas. Esta es la segunda.</text>

  <!-- PASO 1 -->
  <g filter="url(#shadow)"><rect x="60" y="130" width="1480" height="120" rx="14" fill="#f7fafc" stroke="#c9d6e2"/></g>
  <rect x="60" y="130" width="330" height="34" rx="10" fill="#526270"/>
  <text x="80" y="155" class="h2">1 · LA LÍNEA COMPLETA</text>
  <text x="90" y="200" class="code">NC_000913.3  RefSeq  gene  190  255  .  +  .  ID=gene-b0001;Name=thrL;locus_tag=b0001</text>
  <text x="90" y="230" class="small">Ya sabes seleccionarla (S18). Pero contiene mucho más de lo que tu pregunta necesita.</text>

  <line x1="800" y1="256" x2="800" y2="292" stroke="#2878a9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- PASO 2 -->
  <g filter="url(#shadow)"><rect x="60" y="300" width="1480" height="150" rx="14" fill="#eef5fb" stroke="#2878a9"/></g>
  <rect x="60" y="300" width="470" height="34" rx="10" fill="#2878a9"/>
  <text x="80" y="325" class="h2">2 · EXTRAER EL FRAGMENTO</text>
  <text x="90" y="372" class="codeB">grep -oE 'locus_tag=[^;]+'</text>
  <text x="560" y="372" class="small">La opción `-o` cambia lo que devuelve `grep`: ya no la línea,</text>
  <text x="560" y="394" class="small">sino solo la parte que coincide con el patrón.</text>
  <rect x="90" y="392" width="330" height="40" rx="8" fill="#fff" stroke="#2878a9" stroke-width="2"/>
  <text x="106" y="419" class="code" fill="#1e7a52">locus_tag=b0001</text>

  <line x1="800" y1="456" x2="800" y2="492" stroke="#2878a9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- PASO 3 -->
  <g filter="url(#shadow)"><rect x="60" y="500" width="1480" height="150" rx="14" fill="#eef8f2" stroke="#8cc9a9"/></g>
  <rect x="60" y="500" width="470" height="34" rx="10" fill="#1e7a52"/>
  <text x="80" y="525" class="h2">3 · QUEDARSE CON EL VALOR</text>
  <text x="90" y="572" class="codeB">cut -d= -f2</text>
  <text x="560" y="572" class="small">`cut` ya no parte por tabuladores: le indicas otro delimitador.</text>
  <text x="560" y="594" class="small">Aquí, el signo igual separa la clave del valor.</text>
  <rect x="90" y="592" width="330" height="40" rx="8" fill="#fff" stroke="#8cc9a9" stroke-width="2"/>
  <text x="106" y="619" class="code" fill="#1e7a52">b0001</text>

  <line x1="800" y1="656" x2="800" y2="692" stroke="#2878a9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- PASO 4 -->
  <g filter="url(#shadow)"><rect x="60" y="700" width="1480" height="100" rx="14" fill="#f7fafc" stroke="#c9d6e2"/></g>
  <rect x="60" y="700" width="470" height="34" rx="10" fill="#526270"/>
  <text x="80" y="725" class="h2">4 · LA LISTA DE OBJETOS</text>
  <text x="90" y="772" class="codeB">sort -u</text>
  <text x="330" y="772" class="copy">Cada línea de la salida es ahora <tspan font-weight="700">un objeto biológico</tspan>, no un registro del archivo.</text>

  <!-- ADVERTENCIA -->
  <rect x="60" y="820" width="1480" height="60" rx="12" fill="#fdf1ef" stroke="#b03a2e" stroke-width="2"/>
  <text x="95" y="857" class="copy"><tspan font-weight="700">Cuidado con el patrón ambicioso:</tspan> <tspan font-family="Courier New" font-weight="700">locus_tag=.*</tspan> no se detiene en el punto y coma y arrastra el resto de los atributos. Acota siempre el valor con <tspan font-family="Courier New" font-weight="700">[^;]+</tspan>.</text>
</svg>
