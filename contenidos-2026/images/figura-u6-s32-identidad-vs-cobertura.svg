<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="t d">
  <title id="t">Identidad frente a cobertura</title>
  <desc id="d">Dos barras que representan la misma proteína consulta. Hit A cubre casi toda la barra con 55 por ciento de identidad. Hit B cubre solo un extremo con 92 por ciento de identidad. La pregunta al pie es cuál aporta mejor evidencia para explicar toda la proteína.</desc>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17365d" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 34px Arial;fill:#17365d}
      .sub{font:400 18px Arial;fill:#526270}
      .h{font:700 22px Arial;fill:#17365d}
      .copy{font:400 16px Arial;fill:#34495e}
      .small{font:400 14px Arial;fill:#526270}
      .tag{font:700 15px Arial;fill:#ffffff}
      .metric{font:700 18px Arial;fill:#17365d}
      .foot{font:600 18px Arial;fill:#17365d}
    </style>
  </defs>
  <rect width="1600" height="780" fill="#fff"/>
  <text x="800" y="48" class="title" text-anchor="middle">Misma consulta, dos evidencias distintas</text>
  <text x="800" y="80" class="sub" text-anchor="middle">Identidad alta no implica cobertura alta</text>

  <!-- HIT A -->
  <g filter="url(#sh)"><rect x="80" y="120" width="1440" height="240" rx="16" fill="#eef8f2" stroke="#1e7a52" stroke-width="2"/></g>
  <rect x="80" y="120" width="220" height="46" rx="16" fill="#1e7a52"/>
  <rect x="80" y="150" width="220" height="16" fill="#1e7a52"/>
  <text x="190" y="152" class="tag" text-anchor="middle">HIT A</text>

  <text x="120" y="210" class="h">Consulta (248 aa)</text>
  <rect x="120" y="230" width="1100" height="36" rx="6" fill="#ffffff" stroke="#1e7a52" stroke-width="2"/>
  <rect x="120" y="230" width="1078" height="36" rx="6" fill="#1e7a52" opacity="0.35"/>
  <text x="130" y="254" class="small">||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||</text>

  <text x="1260" y="210" class="metric">identidad 55 %</text>
  <text x="1260" y="240" class="metric">cobertura 98 %</text>
  <text x="120" y="310" class="copy">Parecido a lo largo de casi toda la proteína. Menos «brillante», más completo.</text>

  <!-- HIT B -->
  <g filter="url(#sh)"><rect x="80" y="390" width="1440" height="240" rx="16" fill="#fdf1ef" stroke="#b03a2e" stroke-width="2"/></g>
  <rect x="80" y="390" width="220" height="46" rx="16" fill="#b03a2e"/>
  <rect x="80" y="420" width="220" height="16" fill="#b03a2e"/>
  <text x="190" y="422" class="tag" text-anchor="middle">HIT B</text>

  <text x="120" y="480" class="h">Consulta (248 aa)</text>
  <rect x="120" y="500" width="1100" height="36" rx="6" fill="#ffffff" stroke="#c9d6e2" stroke-width="2"/>
  <rect x="120" y="500" width="198" height="36" rx="6" fill="#b03a2e" opacity="0.45"/>
  <text x="130" y="524" class="small">||||||||||||</text>
  <text x="340" y="524" class="small" fill="#b03a2e">solo un fragmento alineado</text>

  <text x="1260" y="480" class="metric">identidad 92 %</text>
  <text x="1260" y="510" class="metric">cobertura 18 %</text>
  <text x="120" y="580" class="copy">Parecido fuerte en un pedazo corto. Puede ser un dominio compartido, no «la misma proteína».</text>

  <!-- PIE -->
  <rect x="80" y="660" width="1440" height="80" rx="12" fill="#eef4fa" stroke="#17365d" stroke-width="2"/>
  <text x="800" y="695" class="foot" text-anchor="middle">¿Cuál aporta mejor evidencia para explicar toda la proteína?  ’  a menudo A, no B</text>
  <text x="800" y="722" class="small" text-anchor="middle">El ranking por una sola métrica miente. Hay que leer identidad y cobertura juntas.</text>
</svg>
