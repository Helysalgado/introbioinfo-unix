<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Anatomía de un comando de Unix</title><desc id="desc">Comando ls -l /home/usuario dividido en tres componentes.</desc><defs><filter id="shadow" x="-12%" y="-12%" width="124%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#52738f"/></marker><marker id="arrowT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#1f6d7a"/></marker><style>.title{font:700 42px Arial;fill:#17365d}.subtitle{font:400 20px Arial;fill:#526270}.h1{font:700 27px Arial;fill:#17365d}.h2{font:700 22px Arial;fill:#17365d}.copy{font:400 18px Arial;fill:#34495e}.small{font:400 15px Arial;fill:#526270}.label{font:700 18px Arial;fill:#17365d}.code{font:700 25px 'Courier New';fill:#17365d}.codeS{font:700 17px 'Courier New';fill:#17365d}.white{font:700 20px Arial;fill:#fff}.whiteS{font:400 16px Arial;fill:#eaf6f7}.num{font:700 22px Arial;fill:#fff;text-anchor:middle;dominant-baseline:middle}.line{fill:none;stroke:#52738f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="58" class="title" text-anchor="middle">Anatomía de un comando de Unix</text><text x="800" y="95" class="subtitle" text-anchor="middle">Un comando combina la herramienta, las opciones y el objeto sobre el que actúa.</text><g filter="url(#shadow)"><rect x="120" y="180" width="1360" height="210" rx="24" fill="#18232c"/></g><text x="465" y="310" font-family="Courier New" font-size="58" font-weight="700" fill="#68b5df" text-anchor="middle">ls</text><text x="800" y="310" font-family="Courier New" font-size="58" font-weight="700" fill="#71c6b8" text-anchor="middle">-l</text><text x="1135" y="310" font-family="Courier New" font-size="58" font-weight="700" fill="#b9a3d3" text-anchor="middle">/home/usuario</text><path d="M465 330V455" class="line"/><path d="M800 330V455" class="line"/><path d="M1135 330V455" class="line"/><g filter="url(#shadow)"><rect x="270" y="455" width="390" height="235" rx="20" fill="#f3f8fc" stroke="#8bb4cf" stroke-width="3"/></g><g filter="url(#shadow)"><rect x="605" y="455" width="390" height="235" rx="20" fill="#f1faf9" stroke="#7ebdb8" stroke-width="3"/></g><g filter="url(#shadow)"><rect x="940" y="455" width="390" height="235" rx="20" fill="#f8f6fb" stroke="#aa98c5" stroke-width="3"/></g><circle cx="465" cy="470" r="34" fill="#2878a9"/><text x="465" y="471" class="num">1</text><circle cx="800" cy="470" r="34" fill="#208b82"/><text x="800" y="471" class="num">2</text><circle cx="1135" cy="470" r="34" fill="#76629a"/><text x="1135" y="471" class="num">3</text><text x="465" y="545" class="h2" text-anchor="middle">COMANDO</text><text x="465" y="585" class="copy" text-anchor="middle"><tspan x="465" dy="0">Programa que se ejecuta</tspan><tspan x="465" dy="29">ls: listar contenido</tspan></text><text x="800" y="545" class="h2" text-anchor="middle">OPCIÓN</text><text x="800" y="585" class="copy" text-anchor="middle"><tspan x="800" dy="0">Modifica el comportamiento</tspan><tspan x="800" dy="29">-l: formato detallado</tspan></text><text x="1135" y="545" class="h2" text-anchor="middle">ARGUMENTO</text><text x="1135" y="585" class="copy" text-anchor="middle"><tspan x="1135" dy="0">Archivo o directorio objetivo</tspan><tspan x="1135" dy="29">/home/usuario</tspan></text><rect x="120" y="750" width="1360" height="75" rx="18" fill="#1f6d7a"/><text x="800" y="797" class="white" text-anchor="middle">comando  [opciones]  [argumentos]</text></svg>