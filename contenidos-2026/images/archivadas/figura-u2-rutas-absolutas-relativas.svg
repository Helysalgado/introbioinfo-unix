<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Rutas absolutas y relativas</title>
  <desc id="desc">Comparación de una ruta absoluta desde la raíz y una ruta relativa desde el directorio actual del proyecto hacia el mismo archivo pacientes.md en el espacio institucional.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12z" fill="#52738f"/>
    </marker>
    <marker id="arrowT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12z" fill="#1f6d7a"/>
    </marker>
    <style>.title{font:700 42px Arial;fill:#17365d}.subtitle{font:400 20px Arial;fill:#526270}.h1{font:700 27px Arial;fill:#17365d}.h2{font:700 22px Arial;fill:#17365d}.copy{font:400 18px Arial;fill:#34495e}.small{font:400 15px Arial;fill:#526270}.label{font:700 18px Arial;fill:#17365d}.code{font:700 25px 'Courier New';fill:#17365d}.codeS{font:700 17px 'Courier New';fill:#17365d}.white{font:700 20px Arial;fill:#fff}.whiteS{font:400 16px Arial;fill:#eaf6f7}.num{font:700 22px Arial;fill:#fff;text-anchor:middle;dominant-baseline:middle}.line{fill:none;stroke:#52738f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" class="title" text-anchor="middle">Rutas absolutas y relativas</text>
  <text x="800" y="95" class="subtitle" text-anchor="middle">Ambas pueden llegar al mismo archivo; cambia el punto desde el que comienza el recorrido.</text>
  <g filter="url(#shadow)">
    <rect x="120" y="150" width="1360" height="545" rx="24" fill="#f8fafb" stroke="#c3cfd7" stroke-width="3"/>
  </g>
  <text x="170" y="215" class="h2" text-anchor="start">RUTA ABSOLUTA</text>
  <text x="170" y="250" class="small" text-anchor="start">Empieza en la ra&#xED;z del sistema</text>
  <circle cx="250" cy="340" r="46" fill="#17365d"/>
  <text x="250" y="352" font-family="Courier New" font-size="38" font-weight="700" fill="#fff" text-anchor="middle">/</text>
  <rect x="365" y="298" width="220" height="84" rx="16" fill="#f3f8fc" stroke="#2878a9" stroke-width="3"/>
  <text x="475" y="349" class="label" text-anchor="middle">export/space3/</text>
  <rect x="645" y="298" width="220" height="84" rx="16" fill="#f1faf9" stroke="#208b82" stroke-width="3"/>
  <text x="755" y="349" class="label" text-anchor="middle">users/$USER/</text>
  <rect x="925" y="298" width="250" height="84" rx="16" fill="#f8f6fb" stroke="#76629a" stroke-width="3"/>
  <text x="1050" y="349" class="label" text-anchor="middle">proyecto/data/source/</text>
  <rect x="1235" y="290" width="190" height="100" rx="16" fill="#fff7e8" stroke="#bd7c1b" stroke-width="3"/>
  <text x="1330" y="332" class="codeS" text-anchor="middle">pacientes.md</text>
  <text x="1330" y="365" class="small" text-anchor="middle">archivo objetivo</text>
  <g class="line" marker-end="url(#arrow)">
    <path d="M296 340H365"/>
    <path d="M585 340H645"/>
    <path d="M865 340H925"/>
  </g>
  <path d="M1175 340H1235" fill="none" stroke="#bd7c1b" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="800" y="420" class="codeS" text-anchor="middle">/export/space3/users/$USER/proyecto/data/source/pacientes.md</text>
  <line x1="170" y1="450" x2="1430" y2="450" stroke="#d7e0e6" stroke-width="3"/>
  <text x="170" y="505" class="h2" text-anchor="start">RUTA RELATIVA</text>
  <text x="170" y="538" class="small" text-anchor="start">Directorio actual (compruébalo con pwd): /export/space3/users/$USER/proyecto/</text>
  <circle cx="330" cy="595" r="46" fill="#208b82"/>
  <text x="330" y="606" font-family="Courier New" font-size="38" font-weight="700" fill="#fff" text-anchor="middle">.</text>
  <path d="M376 595H570" fill="none" stroke="#1f6d7a" stroke-width="5" marker-end="url(#arrowT)"/>
  <rect x="570" y="553" width="330" height="84" rx="16" fill="#f8f6fb" stroke="#76629a" stroke-width="3"/>
  <text x="735" y="604" class="label" text-anchor="middle">data/source/</text>
  <path d="M900 595H1060" fill="none" stroke="#1f6d7a" stroke-width="5" marker-end="url(#arrowT)"/>
  <rect x="1060" y="545" width="250" height="100" rx="16" fill="#fff7e8" stroke="#bd7c1b" stroke-width="3"/>
  <text x="1185" y="587" class="codeS" text-anchor="middle">pacientes.md</text>
  <text x="1185" y="620" class="small" text-anchor="middle">el mismo archivo</text>
  <rect x="120" y="750" width="1360" height="75" rx="18" fill="#1f6d7a"/>
  <text x="800" y="797" class="white" text-anchor="middle">pwd indica d&#xF3;nde est&#xE1;s &#xB7; . significa &#x201C;aqu&#xED;&#x201D; &#xB7; .. sube al padre &#xB7; ~ representa tu home</text>
</svg>
