<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Ciclo de vida de un trabajo en SGE</title><desc id="desc">Flujo de un trabajo SGE desde preparación hasta ejecución y finalización.</desc><defs><filter id="shadow" x="-12%" y="-12%" width="124%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#52738f"/></marker><marker id="arrowT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#1f6d7a"/></marker><style>.title{font:700 42px Arial;fill:#17365d}.subtitle{font:400 20px Arial;fill:#526270}.h1{font:700 27px Arial;fill:#17365d}.h2{font:700 22px Arial;fill:#17365d}.copy{font:400 18px Arial;fill:#34495e}.small{font:400 15px Arial;fill:#526270}.label{font:700 18px Arial;fill:#17365d}.code{font:700 25px 'Courier New';fill:#17365d}.codeS{font:700 17px 'Courier New';fill:#17365d}.white{font:700 20px Arial;fill:#fff}.whiteS{font:400 16px Arial;fill:#eaf6f7}.num{font:700 22px Arial;fill:#fff;text-anchor:middle;dominant-baseline:middle}.line{fill:none;stroke:#52738f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="58" class="title" text-anchor="middle">Ciclo de vida de un trabajo en SGE</text><text x="800" y="95" class="subtitle" text-anchor="middle">El job script se envía a la cola, espera recursos, se ejecuta y produce archivos de salida y error.</text><g filter="url(#shadow)"><rect x="70" y="190" width="300" height="290" rx="20" fill="#f3f8fc" stroke="#8bb4cf" stroke-width="3"/></g><circle cx="220" cy="205" r="38" fill="#2878a9"/><text x="220" y="206" class="num">1</text><text x="220" y="285" class="h2" text-anchor="middle">PREPARAR</text><text x="220" y="340" class="copy" text-anchor="middle"><tspan x="220" dy="0">Escribir mi_trabajo.jdl</tspan><tspan x="220" dy="30">Definir comandos y recursos</tspan></text><g filter="url(#shadow)"><rect x="405" y="190" width="300" height="290" rx="20" fill="#f1faf9" stroke="#7ebdb8" stroke-width="3"/></g><circle cx="555" cy="205" r="38" fill="#208b82"/><text x="555" y="206" class="num">2</text><text x="555" y="285" class="h2" text-anchor="middle">ENVIAR</text><text x="555" y="340" class="copy" text-anchor="middle"><tspan x="555" dy="0">qsub mi_trabajo.jdl</tspan><tspan x="555" dy="30">SGE devuelve un JOBID</tspan></text><g filter="url(#shadow)"><rect x="780" y="190" width="300" height="290" rx="20" fill="#fff7e8" stroke="#d5a44e" stroke-width="3"/></g><circle cx="930" cy="205" r="38" fill="#bd7c1b"/><text x="930" y="206" class="num">3</text><text x="930" y="285" class="h2" text-anchor="middle">ESPERAR · qw</text><text x="930" y="340" class="copy" text-anchor="middle"><tspan x="930" dy="0">El trabajo está en cola</tspan><tspan x="930" dy="30">qstat permite monitorearlo</tspan></text><g filter="url(#shadow)"><rect x="1155" y="190" width="300" height="290" rx="20" fill="#f8f6fb" stroke="#aa98c5" stroke-width="3"/></g><circle cx="1305" cy="205" r="38" fill="#76629a"/><text x="1305" y="206" class="num">4</text><text x="1305" y="285" class="h2" text-anchor="middle">EJECUTAR · r</text><text x="1305" y="340" class="copy" text-anchor="middle"><tspan x="1305" dy="0">Corre en un nodo de cómputo</tspan><tspan x="1305" dy="30">Usa los recursos asignados</tspan></text><g fill="none" stroke="#52738f" stroke-width="5" marker-end="url(#arrow)"><path d="M370 335H405"/><path d="M705 335H780"/><path d="M1080 335H1155"/></g><path d="M1305 480V565H1030" class="line" marker-end="url(#arrowT)"/><g filter="url(#shadow)"><rect x="680" y="550" width="350" height="145" rx="20" fill="#e8f1f3" stroke="#1f6d7a" stroke-width="3"/></g><text x="855" y="600" class="h2" text-anchor="middle">FINALIZAR</text><text x="855" y="640" class="copy" text-anchor="middle"><tspan x="855" dy="0">Revisar .out y .err</tspan><tspan x="855" dy="28">Documentar resultados</tspan></text><path d="M405 560H300V480" fill="none" stroke="#bd7c1b" stroke-width="4" marker-end="url(#arrow)"/><text x="275" y="590" class="codeS" text-anchor="middle">qdel JOBID</text><rect x="70" y="750" width="1460" height="80" rx="18" fill="#1f6d7a"/><text x="105" y="785" class="white" text-anchor="start">COMANDOS DE CONTROL</text><text x="400" y="785" class="whiteS" text-anchor="start">qsub envía · qstat monitorea · qdel cancela · qhost muestra nodos</text></svg>