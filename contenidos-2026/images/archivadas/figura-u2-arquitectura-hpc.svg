<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Arquitectura de un cluster de cómputo HPC</title><desc id="desc">Usuario, nodo de acceso, scheduler, nodos de cómputo y almacenamiento compartido.</desc><defs><filter id="shadow" x="-12%" y="-12%" width="124%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#52738f"/></marker><marker id="arrowT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#1f6d7a"/></marker><style>.title{font:700 42px Arial;fill:#17365d}.subtitle{font:400 20px Arial;fill:#526270}.h1{font:700 27px Arial;fill:#17365d}.h2{font:700 22px Arial;fill:#17365d}.copy{font:400 18px Arial;fill:#34495e}.small{font:400 15px Arial;fill:#526270}.label{font:700 18px Arial;fill:#17365d}.code{font:700 25px 'Courier New';fill:#17365d}.codeS{font:700 17px 'Courier New';fill:#17365d}.white{font:700 20px Arial;fill:#fff}.whiteS{font:400 16px Arial;fill:#eaf6f7}.num{font:700 22px Arial;fill:#fff;text-anchor:middle;dominant-baseline:middle}.line{fill:none;stroke:#52738f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="58" class="title" text-anchor="middle">Arquitectura de un cluster de cómputo HPC</text><text x="800" y="95" class="subtitle" text-anchor="middle">El nodo de acceso prepara el trabajo; el scheduler lo asigna a un nodo de cómputo y todos comparten almacenamiento.</text><g filter="url(#shadow)"><rect x="60" y="220" width="250" height="245" rx="20" fill="#f3f8fc" stroke="#8bb4cf" stroke-width="3"/></g><rect x="115" y="270" width="140" height="90" rx="10" fill="#fff" stroke="#2878a9" stroke-width="4"/><path d="M100 385H270L245 420H125z" fill="#dcecf7" stroke="#2878a9" stroke-width="3"/><text x="185" y="455" class="h2" text-anchor="middle">Usuario</text><path d="M310 345H410" class="line" marker-end="url(#arrow)"/><text x="360" y="325" class="small" text-anchor="middle">SSH</text><g filter="url(#shadow)"><rect x="410" y="220" width="300" height="245" rx="20" fill="#f1faf9" stroke="#7ebdb8" stroke-width="3"/></g><text x="560" y="280" class="h2" text-anchor="middle">Nodo de acceso</text><text x="560" y="325" class="copy" text-anchor="middle"><tspan x="560" dy="0">Editar archivos</tspan><tspan x="560" dy="30">Preparar scripts</tspan><tspan x="560" dy="30">Enviar trabajos</tspan></text><rect x="470" y="410" width="180" height="36" rx="18" fill="#208b82"/><text x="560" y="435" class="whiteS" text-anchor="middle">NO ANÁLISIS PESADOS</text><path d="M710 345H810" class="line" marker-end="url(#arrow)"/><text x="760" y="325" class="small" text-anchor="middle">qsub</text><g filter="url(#shadow)"><rect x="810" y="220" width="280" height="245" rx="20" fill="#fff7e8" stroke="#d5a44e" stroke-width="3"/></g><text x="950" y="280" class="h2" text-anchor="middle">Scheduler / cola</text><text x="950" y="325" class="copy" text-anchor="middle"><tspan x="950" dy="0">Recibe qsub</tspan><tspan x="950" dy="30">Ordena trabajos</tspan><tspan x="950" dy="30">Asigna recursos</tspan></text><text x="950" y="430" class="codeS" text-anchor="middle">qw → r → fin</text><path d="M1090 345H1190" class="line" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="1190" y="170" width="340" height="345" rx="20" fill="#f8f6fb" stroke="#aa98c5" stroke-width="3"/></g><text x="1360" y="225" class="h2" text-anchor="middle">Nodos de cómputo</text><g fill="#eee9f4" stroke="#76629a" stroke-width="3"><rect x="1235" y="270" width="70" height="62" rx="8"/><rect x="1325" y="270" width="70" height="62" rx="8"/><rect x="1415" y="270" width="70" height="62" rx="8"/><rect x="1235" y="365" width="70" height="62" rx="8"/><rect x="1325" y="365" width="70" height="62" rx="8"/><rect x="1415" y="365" width="70" height="62" rx="8"/></g><text x="1360" y="470" class="small" text-anchor="middle">Ejecutan los análisis</text><g filter="url(#shadow)"><rect x="300" y="610" width="1000" height="130" rx="20" fill="#e8f1f3" stroke="#1f6d7a" stroke-width="3"/></g><text x="800" y="658" class="h2" text-anchor="middle">Almacenamiento compartido</text><text x="800" y="698" class="codeS" text-anchor="middle">/export/space3/users/$USER</text><text x="800" y="725" class="small" text-anchor="middle">El nodo de acceso y todos los nodos ven los mismos archivos.</text><g fill="none" stroke="#1f6d7a" stroke-width="4" stroke-dasharray="8 7"><path d="M560 465V610"/><path d="M950 465V610"/><path d="M1360 515V575H1100V610"/></g><rect x="70" y="790" width="1460" height="65" rx="18" fill="#1f6d7a"/><text x="800" y="832" class="white" text-anchor="middle">Prepara en el nodo de acceso; ejecuta los trabajos pesados en los nodos de cómputo.</text></svg>