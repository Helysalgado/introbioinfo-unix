<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Computadora personal, servidor y cluster</title><desc id="desc">Comparación de computadora personal, servidor y cluster HPC.</desc><defs><filter id="shadow" x="-12%" y="-12%" width="124%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#52738f"/></marker><marker id="arrowT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#1f6d7a"/></marker><style>.title{font:700 42px Arial;fill:#17365d}.subtitle{font:400 20px Arial;fill:#526270}.h1{font:700 27px Arial;fill:#17365d}.h2{font:700 22px Arial;fill:#17365d}.copy{font:400 18px Arial;fill:#34495e}.small{font:400 15px Arial;fill:#526270}.label{font:700 18px Arial;fill:#17365d}.code{font:700 25px 'Courier New';fill:#17365d}.codeS{font:700 17px 'Courier New';fill:#17365d}.white{font:700 20px Arial;fill:#fff}.whiteS{font:400 16px Arial;fill:#eaf6f7}.num{font:700 22px Arial;fill:#fff;text-anchor:middle;dominant-baseline:middle}.line{fill:none;stroke:#52738f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="58" class="title" text-anchor="middle">Computadora personal, servidor y cluster</text><text x="800" y="95" class="subtitle" text-anchor="middle">La diferencia principal es la escala de recursos, el número de usuarios y la forma de ejecutar el trabajo.</text><g filter="url(#shadow)"><rect x="90" y="190" width="400" height="500" rx="20" fill="#f3f8fc" stroke="#8bb4cf" stroke-width="3"/></g><rect x="190" y="270" width="200" height="125" rx="10" fill="#fff" stroke="#2878a9" stroke-width="4"/><path d="M165 425H415L380 465H200z" fill="#dcecf7" stroke="#2878a9" stroke-width="3"/><text x="290" y="570" class="h1" text-anchor="middle">Computadora personal</text><text x="290" y="615" class="copy" text-anchor="middle"><tspan x="290" dy="0">Un usuario principal</tspan><tspan x="290" dy="30">Recursos limitados</tspan><tspan x="290" dy="30">Trabajo cotidiano</tspan></text><g filter="url(#shadow)"><rect x="550" y="190" width="400" height="500" rx="20" fill="#f1faf9" stroke="#7ebdb8" stroke-width="3"/></g><g fill="#e3f2ef" stroke="#208b82" stroke-width="3"><rect x="650" y="255" width="200" height="75" rx="10"/><rect x="650" y="350" width="200" height="75" rx="10"/><rect x="650" y="445" width="200" height="75" rx="10"/></g><text x="750" y="570" class="h1" text-anchor="middle">Servidor</text><text x="750" y="615" class="copy" text-anchor="middle"><tspan x="750" dy="0">Potente y compartido</tspan><tspan x="750" dy="30">Siempre encendido</tspan><tspan x="750" dy="30">Acceso mediante SSH</tspan></text><g filter="url(#shadow)"><rect x="1010" y="190" width="400" height="500" rx="20" fill="#f8f6fb" stroke="#aa98c5" stroke-width="3"/></g><g fill="#eee9f4" stroke="#76629a" stroke-width="3"><rect x="1080" y="255" width="75" height="70" rx="8"/><rect x="1180" y="255" width="75" height="70" rx="8"/><rect x="1280" y="255" width="75" height="70" rx="8"/><rect x="1080" y="355" width="75" height="70" rx="8"/><rect x="1180" y="355" width="75" height="70" rx="8"/><rect x="1280" y="355" width="75" height="70" rx="8"/><rect x="1080" y="455" width="75" height="70" rx="8"/><rect x="1180" y="455" width="75" height="70" rx="8"/><rect x="1280" y="455" width="75" height="70" rx="8"/></g><text x="1210" y="570" class="h1" text-anchor="middle">Cluster HPC</text><text x="1210" y="615" class="copy" text-anchor="middle"><tspan x="1210" dy="0">Muchos nodos coordinados</tspan><tspan x="1210" dy="30">Sistema de colas</tspan><tspan x="1210" dy="30">Análisis de gran escala</tspan></text><rect x="90" y="760" width="1320" height="75" rx="18" fill="#1f6d7a"/><text x="750" y="807" class="white" text-anchor="middle">En sistemas compartidos, los recursos se solicitan y administran mediante un scheduler.</text></svg>