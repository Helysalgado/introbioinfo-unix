<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="t d">
  <title id="t">Similitud frente a homología</title>
  <desc id="d">Dos columnas. Izquierda, similitud medida en porcentajes. Derecha, homología como hipótesis de ancestro común. Entre ambas, una flecha rota: no implica.</desc>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17365d" flood-opacity="0.12"/></filter>
    <style>
      .title{font:700 34px Arial;fill:#17365d}
      .sub{font:400 18px Arial;fill:#526270}
      .h{font:700 22px Arial;fill:#ffffff}
      .copy{font:400 16px Arial;fill:#34495e}
      .big{font:700 20px Arial;fill:#17365d}
      .small{font:400 14px Arial;fill:#526270}
      .warn{font:700 20px Arial;fill:#b03a2e}
    </style>
  </defs>
  <rect width="1600" height="700" fill="#fff"/>
  <text x="800" y="48" class="title" text-anchor="middle">La similitud se mide · la homología se argumenta</text>
  <text x="800" y="80" class="sub" text-anchor="middle">No existe «un 80 % de homología»</text>

  <g filter="url(#sh)"><rect x="80" y="120" width="580" height="420" rx="16" fill="#eef4fa" stroke="#17365d" stroke-width="2"/></g>
  <rect x="80" y="120" width="580" height="50" rx="16" fill="#17365d"/>
  <rect x="80" y="150" width="580" height="20" fill="#17365d"/>
  <text x="370" y="155" class="h" text-anchor="middle">SIMILITUD</text>
  <text x="370" y="230" class="big" text-anchor="middle">Se observa y se mide</text>
  <rect x="140" y="270" width="460" height="50" rx="8" fill="#fff" stroke="#1e7a52" stroke-width="2"/>
  <text x="370" y="302" class="copy" text-anchor="middle">identidad 86.6 %</text>
  <rect x="140" y="340" width="460" height="50" rx="8" fill="#fff" stroke="#d18b16" stroke-width="2"/>
  <text x="370" y="372" class="copy" text-anchor="middle">cobertura H 100 %</text>
  <rect x="140" y="410" width="460" height="50" rx="8" fill="#fff" stroke="#b03a2e" stroke-width="2"/>
  <text x="370" y="442" class="copy" text-anchor="middle">E-value muy bajo</text>
  <text x="370" y="510" class="small" text-anchor="middle">Está en el alineamiento y en el .tsv</text>

  <path d="M700 330 L780 330" stroke="#b03a2e" stroke-width="5"/>
  <path d="M840 330 L920 330" stroke="#b03a2e" stroke-width="5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b03a2e"/></marker></defs>
  <circle cx="810" cy="330" r="22" fill="#fff" stroke="#b03a2e" stroke-width="3"/>
  <text x="810" y="338" class="warn" text-anchor="middle">`</text>
  <text x="810" y="300" class="warn" text-anchor="middle">no implica</text>

  <g filter="url(#sh)"><rect x="940" y="120" width="580" height="420" rx="16" fill="#eef8f2" stroke="#1e7a52" stroke-width="2"/></g>
  <rect x="940" y="120" width="580" height="50" rx="16" fill="#1e7a52"/>
  <rect x="940" y="150" width="580" height="20" fill="#1e7a52"/>
  <text x="1230" y="155" class="h" text-anchor="middle">HOMOLOGÍA</text>
  <text x="1230" y="230" class="big" text-anchor="middle">Se infiere y se argumenta</text>
  <circle cx="1230" cy="320" r="36" fill="#fff8e8" stroke="#d18b16" stroke-width="3"/>
  <text x="1230" y="326" class="small" text-anchor="middle">ancestro</text>
  <path d="M1230 356 L1100 430" stroke="#17365d" stroke-width="3"/>
  <path d="M1230 356 L1360 430" stroke="#17365d" stroke-width="3"/>
  <rect x="1030" y="430" width="140" height="40" rx="8" fill="#fff" stroke="#17365d"/>
  <rect x="1290" y="430" width="140" height="40" rx="8" fill="#fff" stroke="#17365d"/>
  <text x="1100" y="456" class="small" text-anchor="middle">proteína A</text>
  <text x="1360" y="456" class="small" text-anchor="middle">proteína B</text>
  <text x="1230" y="510" class="small" text-anchor="middle">Hipótesis sobre el pasado  binaria</text>

  <rect x="80" y="570" width="1440" height="80" rx="12" fill="#fdf1ef" stroke="#b03a2e" stroke-width="2"/>
  <text x="800" y="618" style="font:600 18px Arial;fill:#17365d" text-anchor="middle">Un porcentaje alto puede apoyar la hipótesis. No la imprime en una columna.</text>
</svg>
