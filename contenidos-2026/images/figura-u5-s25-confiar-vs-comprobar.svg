<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dos caminos ante una entrada que falta</title>
  <desc id="desc">Se compara el comportamiento de dos scripts a los que se les pasa un archivo que no existe. El primero confía: ejecuta el primer comando, que protesta con un aviso que queda enterrado, crea igualmente el archivo de salida vacío, sigue con los pasos siguientes, imprime que terminó y devuelve código cero, de modo que quien lo ejecuta cree que el análisis se hizo. El segundo comprueba antes de trabajar: detecta que el archivo no existe, escribe un mensaje de error por el canal de error indicando qué falta y cómo se invoca el script, se detiene sin haber creado ningún archivo y devuelve un código distinto de cero. Una franja inferior resume que la diferencia no es de estilo sino de honestidad: un resultado ausente es preferible a un resultado falso.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowred" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11z" fill="#b03a2e"/>
    </marker>
    <marker id="arrowgrn" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11z" fill="#1e7a52"/>
    </marker>
    <style>
      .title{font:700 40px Arial;fill:#17365d}
      .subtitle{font:400 20px Arial;fill:#526270}
      .tag{font:700 15px Arial;fill:#fff}
      .copy{font:400 16px Arial;fill:#34495e}
      .small{font:400 14px Arial;fill:#526270}
      .code{font:400 15px 'Courier New';fill:#17365d}
      .err{font:400 15px 'Courier New';fill:#b03a2e}
      .ok{font:400 15px 'Courier New';fill:#1e7a52}
      .codew{font:400 15px 'Courier New';fill:#ffffff}
      .h3{font:700 19px Arial;fill:#17365d}
      .band{font:400 19px Arial;fill:#17365d}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <text x="800" y="52" class="title" text-anchor="middle">Dos caminos ante una entrada que falta</text>
  <text x="800" y="88" class="subtitle" text-anchor="middle">La misma orden, con un archivo que no existe. Un script confía; el otro comprueba.</text>

  <rect x="480" y="110" width="640" height="46" rx="10" fill="#17365d"/>
  <text x="500" y="141" class="codew">$ ./analizar-genoma.sh ecoli.fna NOEXISTE.gff3</text>

  <!-- ================= CONFÍA ================= -->
  <g filter="url(#shadow)"><rect x="55" y="184" width="690" height="500" rx="16" fill="#fdf1ef" stroke="#b03a2e"/></g>
  <rect x="55" y="184" width="230" height="34" rx="10" fill="#b03a2e"/>
  <text x="75" y="209" class="tag">UN SCRIPT QUE CONFÍA</text>

  <rect x="85" y="238" width="630" height="42" rx="8" fill="#fff" stroke="#c9d6e2"/>
  <text x="105" y="265" class="code">grep -Ev '^#' "$GFF" &gt; derivado.gff3</text>
  <path d="M400 284 L400 306" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#arrowred)"/>

  <rect x="85" y="312" width="630" height="42" rx="8" fill="#fff" stroke="#c9d6e2"/>
  <text x="105" y="339" class="err">grep: NOEXISTE.gff3: No such file or directory</text>
  <path d="M400 358 L400 380" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#arrowred)"/>

  <rect x="85" y="386" width="630" height="42" rx="8" fill="#fff" stroke="#c9d6e2"/>
  <text x="105" y="413" class="copy">crea <tspan class="code">derivado.gff3</tspan> igualmente — 0 bytes</text>
  <path d="M400 432 L400 454" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#arrowred)"/>

  <rect x="85" y="460" width="630" height="42" rx="8" fill="#fff" stroke="#c9d6e2"/>
  <text x="105" y="487" class="copy">sigue con los pasos 2, 3, 4… sobre un archivo vacío</text>
  <path d="M400 506 L400 528" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#arrowred)"/>

  <rect x="85" y="534" width="630" height="70" rx="8" fill="#fff" stroke="#b03a2e" stroke-width="2"/>
  <text x="105" y="562" class="code">Terminado. Resultados en results/s25/</text>
  <text x="105" y="592" class="code">$? = 0   <tspan class="small">«todo bien»</tspan></text>

  <text x="85" y="640" class="copy" font-weight="700">Quien lo ejecutó cree que el análisis se hizo.</text>
  <text x="85" y="666" class="small">El aviso de grep quedó enterrado entre los mensajes de avance.</text>

  <!-- ================= COMPRUEBA ================= -->
  <g filter="url(#shadow)"><rect x="855" y="184" width="690" height="500" rx="16" fill="#eef8f2" stroke="#1e7a52"/></g>
  <rect x="855" y="184" width="270" height="34" rx="10" fill="#1e7a52"/>
  <text x="875" y="209" class="tag">UN SCRIPT QUE COMPRUEBA</text>

  <rect x="885" y="238" width="630" height="70" rx="8" fill="#fff" stroke="#c9d6e2"/>
  <text x="905" y="266" class="code">if [ ! -s "$GFF" ]; then</text>
  <text x="905" y="294" class="small">antes de tocar nada: ¿existe y tiene contenido?</text>
  <path d="M1200 312 L1200 334" stroke="#1e7a52" stroke-width="2.5" marker-end="url(#arrowgrn)"/>

  <rect x="885" y="340" width="630" height="98" rx="8" fill="#fff" stroke="#c9d6e2"/>
  <text x="905" y="368" class="err">ERROR: el GFF3 no existe o está vacío:</text>
  <text x="905" y="392" class="err">       NOEXISTE.gff3</text>
  <text x="905" y="420" class="code">Uso: ./analizar-genoma.sh &lt;fna&gt; &lt;gff3&gt;</text>
  <path d="M1200 442 L1200 464" stroke="#1e7a52" stroke-width="2.5" marker-end="url(#arrowgrn)"/>

  <rect x="885" y="470" width="630" height="42" rx="8" fill="#fff" stroke="#c9d6e2"/>
  <text x="905" y="497" class="copy">se detiene: <tspan font-weight="700">ningún archivo creado</tspan></text>
  <path d="M1200 516 L1200 538" stroke="#1e7a52" stroke-width="2.5" marker-end="url(#arrowgrn)"/>

  <rect x="885" y="544" width="630" height="60" rx="8" fill="#fff" stroke="#1e7a52" stroke-width="2"/>
  <text x="905" y="582" class="ok">$? = 1   <tspan class="small">«algo salió mal»</tspan></text>

  <text x="885" y="640" class="copy" font-weight="700">Quien lo ejecutó sabe exactamente qué falta.</text>
  <text x="885" y="666" class="small">Y sabe, además, que no hay nada que tirar a la basura.</text>

  <!-- ================= FRANJA ================= -->
  <rect x="55" y="722" width="1490" height="120" rx="14" fill="#eef8f2" stroke="#1e7a52"/>
  <text x="85" y="764" class="band">La diferencia no es de estilo: es de <tspan font-weight="700">honestidad científica</tspan>.</text>
  <text x="85" y="802" class="copy">Un resultado ausente se nota y se corrige. Un resultado falso se publica. Comprobar las entradas cuesta cuatro líneas.</text>
</svg>
