<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="t d">
  <title id="t">La conservación no se reparte de manera uniforme</title>
  <desc id="d">Un perfil de barras de altura variable calculado sobre el alineamiento real de la proteína ubiE de Rickettsia conorii y Orientia tsutsugamushi. Se ven zonas de barras muy altas separadas por zonas de barras bajas, y flechas que apuntan a las zonas altas con la etiqueta no puede cambiar sin romper algo. Una nota lateral advierte que esta es una observación, y que atribuirle una función concreta ya sería una inferencia que hoy no se hace.</desc>
  <defs>
    <filter id="sh" x="-6%" y="-10%" width="112%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17365d" flood-opacity="0.13"/>
    </filter>
    <marker id="dn" markerWidth="11" markerHeight="11" refX="5.5" refY="10" orient="auto"><path d="M0,0 L11,0 L5.5,11 z" fill="#1e7a52"/></marker>
    <marker id="dr" markerWidth="11" markerHeight="11" refX="5.5" refY="10" orient="auto"><path d="M0,0 L11,0 L5.5,11 z" fill="#b03a2e"/></marker>
    <style>
      .title{font:700 36px Arial;fill:#17365d}
      .sub{font:400 18px Arial;fill:#526270}
      .copy{font:400 15px Arial;fill:#34495e}
      .small{font:400 13px Arial;fill:#526270}
      .ax{font:400 13px Arial;fill:#526270}
      .note{font:700 15px Arial;fill:#1e7a52}
