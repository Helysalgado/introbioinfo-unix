    </style>
  </defs>
  <rect width="1600" height="760" fill="#fff"/>

  <text x="800" y="48" class="title" text-anchor="middle">La conservación no se reparte de manera uniforme</text>
  <text x="800" y="78" class="sub" text-anchor="middle">Identidad en ventanas de 9 columnas, sobre el alineamiento real de ubiE</text>
  <text x="800" y="102" class="sub" text-anchor="middle">R. conorii frente a O. tsutsugamushi — 257 columnas, 49 % de identidad global</text>

