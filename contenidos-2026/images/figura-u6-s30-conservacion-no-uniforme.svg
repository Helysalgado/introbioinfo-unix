  <!-- FRANJA VERDE: observación -->
  <g filter="url(#sh)"><rect x="45" y="486" width="740" height="150" rx="14" fill="#eef8f2" stroke="#1e7a52" stroke-width="2"/></g>
  <rect x="45" y="486" width="740" height="40" rx="14" fill="#1e7a52"/><rect x="45" y="512" width="740" height="14" fill="#1e7a52"/>
  <text x="70" y="514" class="tag">HASTA AQUÍ HAS OBSERVADO</text>
  <text x="70" y="558" class="copy">«La región que va de la columna 73 a la 81 no tiene ninguna</text>
  <text x="70" y="582" class="copy">diferencia entre los dos organismos.»</text>
  <text x="70" y="614" class="small">Se comprueba abriendo el archivo de salida. No admite discusión.</text>

  <!-- FRANJA ROJA: inferencia -->
  <g filter="url(#sh)"><rect x="815" y="486" width="740" height="150" rx="14" fill="#fdf1ef" stroke="#b03a2e" stroke-width="2"/></g>
  <rect x="815" y="486" width="740" height="40" rx="14" fill="#b03a2e"/><rect x="815" y="512" width="740" height="14" fill="#b03a2e"/>
  <text x="840" y="514" class="tag">ESTO YA SERÍA INFERIR — HOY NO SE HACE</text>
  <text x="840" y="558" class="copy">«Esa región es el sitio activo de la enzima.»</text>
  <text x="840" y="582" class="copy">«Las dos proteínas hacen lo mismo.»</text>
  <text x="840" y="614" class="small">Puede que sean ciertas. Hoy no tienes con qué sostenerlas.</text>

  <!-- FRANJA FINAL -->
  <rect x="45" y="656" width="1510" height="82" rx="14" fill="#eef5fb" stroke="#2878a9"/>
  <text x="80" y="694" class="band"><tspan font-weight="700">Lo informativo no es el 49 %. Es el patrón.</tspan></text>
  <text x="80" y="722" class="copy" font-size="16">Que unas regiones se mantengan intactas mientras el resto acumula cambios sugiere que esas regiones no pueden cambiar sin romper algo.</text>
