<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cinco explicaciones posibles de una discrepancia entre fuentes</title>
  <desc id="desc">Cinco tarjetas presentan causas alternativas de una diferencia entre dos inventarios, cada una con un ejemplo y con la comprobación que permite distinguirla. Primera, el alcance del recurso: una fuente de proteínas no incluye genes de RNA ni pseudogenes, y se comprueba viendo si lo que falta pertenece siempre a esas categorías. Segunda, la versión del ensamblado o de la anotación: cada recurso congela una versión distinta, y se comprueba contrastando las fechas y versiones de las dos fichas de procedencia. Tercera, el criterio de anotación: dos procedimientos pueden discrepar sobre si una región corta es un gen real, y se comprueba inspeccionando casos concretos. Cuarta, los filtros aplicados al descargar: una consulta puede haber restringido el conjunto sin que se note, y se comprueba releyendo la consulta guardada. Quinta, la estrategia de conteo propia: contar registros no es contar objetos, y se comprueba repitiendo el conteo con identificadores únicos. Una franja inferior indica el orden en que conviene revisarlas, señala que existe una sexta vía —un archivo equivocado, una consulta mal construida o un fallo de la fuente— que se demuestra en lugar de suponerse, y precisa que declarar qué alternativas siguen abiertas también es un resultado.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/>
    </filter>
    <style>
      .title{font:700 42px Arial;fill:#17365d}
      .subtitle{font:400 20px Arial;fill:#526270}
      .num{font:700 22px Arial;fill:#fff}
      .h3{font:700 20px Arial;fill:#17365d}
      .copy{font:400 16px Arial;fill:#34495e}
      .small{font:400 15px Arial;fill:#526270}
      .lbl{font:700 14px Arial;fill:#526270}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <text x="800" y="56" class="title" text-anchor="middle">Hipótesis antes que culpables</text>
  <text x="800" y="92" class="subtitle" text-anchor="middle">Cinco explicaciones que conviene revisar antes de declarar un error, cada una con su comprobación.</text>

  <!-- 1 -->
  <g filter="url(#shadow)"><rect x="60" y="140" width="290" height="330" rx="16" fill="#eef5fb" stroke="#2878a9"/></g>
  <circle cx="105" cy="185" r="24" fill="#2878a9"/><text x="105" y="193" class="num" text-anchor="middle">1</text>
  <text x="145" y="182" class="h3">Alcance</text>
  <text x="145" y="204" class="h3">del recurso</text>
  <text x="85" y="252" class="copy">Cada recurso decide qué</text>
  <text x="85" y="274" class="copy">objetos incluye.</text>
  <text x="85" y="312" class="lbl">EJEMPLO</text>
  <text x="85" y="336" class="small">Un catálogo de proteínas no</text>
  <text x="85" y="357" class="small">contiene genes de RNA ni</text>
  <text x="85" y="378" class="small">pseudogenes.</text>
  <text x="85" y="414" class="lbl">CÓMO LO COMPRUEBO</text>
  <text x="85" y="438" class="small">¿Lo que falta pertenece</text>
  <text x="85" y="459" class="small">siempre a esas categorías?</text>

  <!-- 2 -->
  <g filter="url(#shadow)"><rect x="370" y="140" width="290" height="330" rx="16" fill="#fdf7e8" stroke="#d18b16"/></g>
  <circle cx="415" cy="185" r="24" fill="#d18b16"/><text x="415" y="193" class="num" text-anchor="middle">2</text>
  <text x="455" y="182" class="h3">Versión</text>
  <text x="455" y="204" class="h3">congelada</text>
  <text x="395" y="252" class="copy">Cada fuente publica en su</text>
  <text x="395" y="274" class="copy">propio calendario.</text>
  <text x="395" y="312" class="lbl">EJEMPLO</text>
  <text x="395" y="336" class="small">Mi GFF3 es de una versión</text>
  <text x="395" y="357" class="small">posterior a la que usó la</text>
  <text x="395" y="378" class="small">otra fuente.</text>
  <text x="395" y="414" class="lbl">CÓMO LO COMPRUEBO</text>
  <text x="395" y="438" class="small">Contrastar fechas y versiones</text>
  <text x="395" y="459" class="small">de las dos fichas (U3).</text>

  <!-- 3 -->
  <g filter="url(#shadow)"><rect x="680" y="140" width="290" height="330" rx="16" fill="#f3eefa" stroke="#7d5ba6"/></g>
  <circle cx="725" cy="185" r="24" fill="#7d5ba6"/><text x="725" y="193" class="num" text-anchor="middle">3</text>
  <text x="765" y="182" class="h3">Criterio de</text>
  <text x="765" y="204" class="h3">anotación</text>
  <text x="705" y="252" class="copy">Dos procedimientos pueden</text>
  <text x="705" y="274" class="copy">discrepar de buena fe.</text>
  <text x="705" y="312" class="lbl">EJEMPLO</text>
  <text x="705" y="336" class="small">¿Esa región corta es un gen</text>
  <text x="705" y="357" class="small">real o ruido de predicción?</text>
  <text x="705" y="378" class="small">Cada fuente decidió distinto.</text>
  <text x="705" y="414" class="lbl">CÓMO LO COMPRUEBO</text>
  <text x="705" y="438" class="small">Inspeccionar casos concretos,</text>
  <text x="705" y="459" class="small">uno por uno.</text>

  <!-- 4 -->
  <g filter="url(#shadow)"><rect x="990" y="140" width="290" height="330" rx="16" fill="#eef8f2" stroke="#8cc9a9"/></g>
  <circle cx="1035" cy="185" r="24" fill="#1e7a52"/><text x="1035" y="193" class="num" text-anchor="middle">4</text>
  <text x="1075" y="182" class="h3">Filtros de</text>
  <text x="1075" y="204" class="h3">la descarga</text>
  <text x="1015" y="252" class="copy">La consulta pudo restringir</text>
  <text x="1015" y="274" class="copy">el conjunto sin avisar.</text>
  <text x="1015" y="312" class="lbl">EJEMPLO</text>
  <text x="1015" y="336" class="small">Descargué solo entradas</text>
  <text x="1015" y="357" class="small">revisadas, o solo un</text>
  <text x="1015" y="378" class="small">subconjunto del proteoma.</text>
  <text x="1015" y="414" class="lbl">CÓMO LO COMPRUEBO</text>
  <text x="1015" y="438" class="small">Releer la consulta exacta</text>
  <text x="1015" y="459" class="small">que guardé en la ficha.</text>

  <!-- 5 -->
  <g filter="url(#shadow)"><rect x="1300" y="140" width="240" height="330" rx="16" fill="#fdf1ef" stroke="#b03a2e"/></g>
  <circle cx="1345" cy="185" r="24" fill="#b03a2e"/><text x="1345" y="193" class="num" text-anchor="middle">5</text>
  <text x="1385" y="182" class="h3">Mi propia</text>
  <text x="1385" y="204" class="h3">estrategia</text>
  <text x="1325" y="252" class="copy">La causa también</text>
  <text x="1325" y="274" class="copy">puede estar aquí.</text>
  <text x="1325" y="312" class="lbl">EJEMPLO</text>
  <text x="1325" y="336" class="small">Conté registros donde</text>
  <text x="1325" y="357" class="small">debía contar objetos,</text>
  <text x="1325" y="378" class="small">o normalicé de más.</text>
  <text x="1325" y="414" class="lbl">CÓMO LO COMPRUEBO</text>
  <text x="1325" y="438" class="small">Repetir el conteo con</text>
  <text x="1325" y="459" class="small">identificadores únicos.</text>

  <!-- FRANJA -->
  <g filter="url(#shadow)"><rect x="60" y="520" width="1480" height="150" rx="16" fill="#f7fafc" stroke="#c9d6e2"/></g>
  <text x="90" y="565" class="h3">Cómo se usa esta figura</text>
  <text x="90" y="602" class="copy">Toma cada discrepancia de tu comparación y recórrela por las cinco tarjetas, en este orden: primero descarta las que dependen del recurso</text>
  <text x="90" y="630" class="copy">(1, 2 y 4), porque son las más frecuentes y las más fáciles de comprobar; después las que exigen mirar biología (3); y deja la 5 para el final,</text>
  <text x="90" y="658" class="copy">pero <tspan font-weight="700">no la omitas nunca</tspan>: la explicación más incómoda es la que apunta a tu propio análisis.</text>

  <rect x="60" y="700" width="1480" height="150" rx="16" fill="#eef5fb" stroke="#2878a9" stroke-width="2"/>
  <text x="90" y="745" class="h3" fill="#2878a9">¿Y si de verdad hay un error?</text>
  <text x="90" y="782" class="copy">Existe una sexta vía: un archivo equivocado, una consulta mal construida o un fallo de la propia fuente. Ocurre, y hay que poder llegar</text>
  <text x="90" y="810" class="copy">a ella — pero se demuestra, no se supone: después de revisar las cinco anteriores y con evidencia concreta. Tampoco hace falta llegar</text>
  <text x="90" y="838" class="copy">siempre a una respuesta: decir qué alternativas siguen abiertas y qué observación las distinguiría <tspan font-weight="700">también es un resultado</tspan>.</text>
</svg>
