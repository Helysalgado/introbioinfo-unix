<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Número de genes frente a densidad génica</title>
  <desc id="desc">Dos comparaciones muestran que contar genes y medir densidad responden preguntas distintas. En la primera, un cromosoma grande con muchos genes y un plásmido pequeño con muy pocos resultan tener densidades parecidas, cercanas a un gen por kilobase: aunque los conteos son muy diferentes, los dos replicones están igual de compactos. En la segunda, dos replicones con el mismo número de genes tienen densidades muy distintas porque uno es mucho más largo que el otro. Una franja final indica que el número de genes depende del tamaño del replicón y por eso no permite comparar replicones entre sí, mientras que la densidad divide entre la longitud y sí lo permite, y advierte que la densidad debe calcularse con la longitud declarada del replicón y con las unidades explícitas.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/>
    </filter>
    <style>
      .title{font:700 42px Arial;fill:#17365d}
      .subtitle{font:400 20px Arial;fill:#526270}
      .tag{font:700 16px Arial;fill:#fff}
      .copy{font:400 17px Arial;fill:#34495e}
      .small{font:400 15px Arial;fill:#526270}
      .h3{font:700 21px Arial;fill:#17365d}
      .num{font:700 26px Arial;fill:#17365d}
      .lbl{font:700 14px Arial;fill:#526270}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>

  <text x="800" y="56" class="title" text-anchor="middle">Contar no es medir densidad</text>
  <text x="800" y="92" class="subtitle" text-anchor="middle">El número de genes depende del tamaño del replicón. La densidad, no: por eso permite comparar.</text>

  <!-- CASO 1 -->
  <g filter="url(#shadow)"><rect x="60" y="130" width="1480" height="300" rx="16" fill="#eef5fb" stroke="#2878a9"/></g>
  <rect x="60" y="130" width="600" height="34" rx="10" fill="#2878a9"/>
  <text x="80" y="155" class="tag">CASO 1 · conteos muy distintos, densidades parecidas</text>

  <text x="90" y="200" class="lbl">CROMOSOMA</text>
  <rect x="90" y="215" width="900" height="46" rx="6" fill="#8cc9a9" stroke="#1e7a52" stroke-width="2"/>
  <text x="540" y="245" class="copy" text-anchor="middle" font-weight="700">4 600 kb · 4 400 genes</text>
  <rect x="1030" y="212" width="200" height="52" rx="8" fill="#fff" stroke="#1e7a52" stroke-width="2"/>
  <text x="1130" y="248" class="num" text-anchor="middle" fill="#1e7a52">0,96</text>
  <text x="1250" y="248" class="copy">genes/kb</text>

  <text x="90" y="305" class="lbl">PLÁSMIDO</text>
  <rect x="90" y="320" width="60" height="46" rx="6" fill="#8cc9a9" stroke="#1e7a52" stroke-width="2"/>
  <text x="180" y="350" class="copy" font-weight="700">5 kb · 5 genes</text>
  <rect x="1030" y="317" width="200" height="52" rx="8" fill="#fff" stroke="#1e7a52" stroke-width="2"/>
  <text x="1130" y="353" class="num" text-anchor="middle" fill="#1e7a52">1,00</text>
  <text x="1250" y="353" class="copy">genes/kb</text>

  <text x="90" y="405" class="copy">880 veces más genes en el cromosoma, y sin embargo <tspan font-weight="700">los dos están igual de compactos</tspan>. El conteo no lo habría dicho.</text>

  <!-- CASO 2 -->
  <g filter="url(#shadow)"><rect x="60" y="460" width="1480" height="290" rx="16" fill="#fdf7e8" stroke="#d18b16"/></g>
  <rect x="60" y="460" width="560" height="34" rx="10" fill="#d18b16"/>
  <text x="80" y="485" class="tag">CASO 2 · mismo conteo, densidades muy distintas</text>

  <text x="90" y="530" class="lbl">REPLICÓN A</text>
  <rect x="90" y="545" width="200" height="46" rx="6" fill="#f0c987" stroke="#d18b16" stroke-width="2"/>
  <text x="320" y="575" class="copy" font-weight="700">100 kb · 90 genes</text>
  <rect x="1030" y="542" width="200" height="52" rx="8" fill="#fff" stroke="#d18b16" stroke-width="2"/>
  <text x="1130" y="578" class="num" text-anchor="middle" fill="#d18b16">0,90</text>
  <text x="1250" y="578" class="copy">genes/kb</text>

  <text x="90" y="632" class="lbl">REPLICÓN B</text>
  <rect x="90" y="647" width="800" height="46" rx="6" fill="#f0c987" stroke="#d18b16" stroke-width="2"/>
  <text x="490" y="677" class="copy" text-anchor="middle" font-weight="700">400 kb · 90 genes</text>
  <rect x="1030" y="644" width="200" height="52" rx="8" fill="#fff" stroke="#d18b16" stroke-width="2"/>
  <text x="1130" y="680" class="num" text-anchor="middle" fill="#d18b16">0,23</text>
  <text x="1250" y="680" class="copy">genes/kb</text>

  <text x="90" y="728" class="copy">El mismo número de genes, cuatro veces más espacio: <tspan font-weight="700">B está mucho más vacío</tspan>, y eso sí pide una explicación biológica.</text>

  <!-- CIERRE -->
  <rect x="60" y="775" width="1480" height="85" rx="12" fill="#f7fafc" stroke="#c9d6e2" stroke-width="2"/>
  <text x="95" y="815" class="copy"><tspan font-weight="700">densidad = número de genes ÷ (longitud del replicón en pares de bases ÷ 1000)</tspan> — y la longitud es la que declara el archivo, no la que ocupan los genes.</text>
  <text x="95" y="845" class="copy">Escribe siempre las unidades: un número sin «genes/kb» al lado no se puede comparar con nada, ni contigo mismo dentro de un mes.</text>
</svg>
