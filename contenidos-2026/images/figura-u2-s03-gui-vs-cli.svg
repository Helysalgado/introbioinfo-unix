<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">GUI y CLI: dos formas de interactuar con una computadora</title><desc id="desc">Comparación entre una interfaz gráfica y una terminal de comandos.</desc><defs><filter id="shadow" x="-12%" y="-12%" width="124%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity="0.13"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#52738f"/></marker><marker id="arrowT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#1f6d7a"/></marker><style>.title{font:700 42px Arial;fill:#17365d}.subtitle{font:400 20px Arial;fill:#526270}.h1{font:700 27px Arial;fill:#17365d}.h2{font:700 22px Arial;fill:#17365d}.copy{font:400 18px Arial;fill:#34495e}.small{font:400 15px Arial;fill:#526270}.label{font:700 18px Arial;fill:#17365d}.code{font:700 25px 'Courier New';fill:#17365d}.codeS{font:700 17px 'Courier New';fill:#17365d}.white{font:700 20px Arial;fill:#fff}.whiteS{font:400 16px Arial;fill:#eaf6f7}.num{font:700 22px Arial;fill:#fff;text-anchor:middle;dominant-baseline:middle}.line{fill:none;stroke:#52738f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="58" class="title" text-anchor="middle">GUI y CLI: dos formas de interactuar con una computadora</text><text x="800" y="95" class="subtitle" text-anchor="middle">La interfaz gráfica facilita la exploración; la línea de comandos favorece la automatización y la reproducibilidad.</text><g filter="url(#shadow)"><rect x="120" y="165" width="620" height="570" rx="20" fill="#f3f8fc" stroke="#8bb4cf" stroke-width="3"/></g><text x="430" y="215" class="h1" text-anchor="middle">GUI · Interfaz gráfica</text><rect x="185" y="255" width="490" height="270" rx="15" fill="#fff" stroke="#8bb4cf" stroke-width="3"/><rect x="185" y="255" width="490" height="46" rx="15" fill="#dce8ef"/><circle cx="215" cy="278" r="7" fill="#d35f5f"/><circle cx="240" cy="278" r="7" fill="#d5a44e"/><circle cx="265" cy="278" r="7" fill="#5aa876"/><rect x="220" y="330" width="190" height="70" rx="10" fill="#e7eff5"/><rect x="430" y="330" width="205" height="165" rx="10" fill="#f0f4f7"/><text x="315" y="370" class="label" text-anchor="middle">Botones y menús</text><text x="430" y="575" class="copy" text-anchor="middle"><tspan x="430" dy="0">Intuitiva para comenzar</tspan><tspan x="430" dy="34">Acciones mediante clics</tspan><tspan x="430" dy="34">Automatización limitada</tspan></text>
<g filter="url(#shadow)"><rect x="860" y="165" width="620" height="570" rx="20" fill="#f1faf9" stroke="#7ebdb8" stroke-width="3"/></g><text x="1170" y="215" class="h1" text-anchor="middle">CLI · Línea de comandos</text><rect x="925" y="255" width="490" height="270" rx="15" fill="#18232c"/><rect x="925" y="255" width="490" height="46" rx="15" fill="#33414b"/><circle cx="955" cy="278" r="7" fill="#d35f5f"/><circle cx="980" cy="278" r="7" fill="#d5a44e"/><circle cx="1005" cy="278" r="7" fill="#5aa876"/><text x="965" y="350" font-family="Courier New" font-size="20" fill="#9bd2ac">usuario@servidor:~$</text><text x="965" y="392" font-family="Courier New" font-size="20" fill="#fff">grep -c "&gt;" genoma.fasta</text><text x="965" y="435" font-family="Courier New" font-size="20" fill="#8fc2e2">128</text><text x="1170" y="575" class="copy" text-anchor="middle"><tspan x="1170" dy="0">Cada acción queda escrita</tspan><tspan x="1170" dy="34">Se puede guardar y repetir</tspan><tspan x="1170" dy="34">Ideal para automatizar análisis</tspan></text><rect x="120" y="780" width="1360" height="70" rx="18" fill="#1f6d7a"/><text x="800" y="824" class="white" text-anchor="middle">En bioinformática, la CLI convierte las acciones en procedimientos reproducibles.</text></svg>